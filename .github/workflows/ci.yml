# CI: Build, test, and check on every push and PR to master.
# Requirements: none (no secrets needed).

name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore tools
        run: dotnet tool restore

      - name: Format check
        run: dotnet fantomas --check .

      - name: Restore
        run: dotnet restore OrgCli.slnx

      - name: Build
        run: dotnet build OrgCli.slnx --no-restore --warnaserror

      - name: Test
        run: dotnet test OrgCli.slnx --no-build --collect:"XPlat Code Coverage"

      - name: API and MCP process smoke tests
        run: python3 tests/server_smoke.py

      - name: Service entrypoint and unit smoke tests
        run: python3 tests/service_smoke.py

      - name: Browser task workflow
        run: |
          python3 -m venv "$RUNNER_TEMP/org-browser-tests"
          "$RUNNER_TEMP/org-browser-tests/bin/pip" install -r tests/requirements-browser.txt
          "$RUNNER_TEMP/org-browser-tests/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/org-browser-tests/bin/python" tests/browser_smoke.py

      - name: Vulnerability check
        run: |
          dotnet list OrgCli.slnx package --vulnerable --include-transitive --format json > audit.json
          cat audit.json
          jq -e '[.. | objects | .vulnerabilities? // empty | .[]] | length == 0' audit.json
