<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Org · Tasks</title>
        <script>
            // Apply the saved preference before painting; storage may be unavailable.
            try {
                const theme = localStorage.getItem("org-theme");
                if (theme === "light" || theme === "dark")
                    document.documentElement.dataset.theme = theme;
            } catch {}
        </script>
        <style>
            :root {
                color-scheme: light;
                --bg: #f6f5f1;
                --paper: #fffefa;
                --ink: #23332d;
                --muted: #647168;
                --line: #dce1d9;
                --green: #23624c;
                --accent: #eaf2eb;
                --warn: #94620e;
                --primary-ink: #ffffff;
                --primary-hover: #194b39;
                --warning-bg: #fff0cf;
                --blocked-bg: #f7e8e4;
                --danger: #983b2d;
                --working-bg: #e5eef7;
                --working-ink: #335d86;
            }
            :root[data-theme="dark"] {
                color-scheme: dark;
                --bg: #151b18;
                --paper: #1e2722;
                --ink: #e5ece6;
                --muted: #a6b5aa;
                --line: #405047;
                --green: #8ad5ad;
                --accent: #293e32;
                --warn: #f0ca80;
                --primary-ink: #14291e;
                --primary-hover: #a7e5c3;
                --warning-bg: #3d3220;
                --blocked-bg: #402923;
                --danger: #f2a18f;
                --working-bg: #25374a;
                --working-ink: #a2c7ed;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    color-scheme: dark;
                    --bg: #151b18;
                    --paper: #1e2722;
                    --ink: #e5ece6;
                    --muted: #a6b5aa;
                    --line: #405047;
                    --green: #8ad5ad;
                    --accent: #293e32;
                    --warn: #f0ca80;
                    --primary-ink: #14291e;
                    --primary-hover: #a7e5c3;
                    --warning-bg: #3d3220;
                    --blocked-bg: #402923;
                    --danger: #f2a18f;
                    --working-bg: #25374a;
                    --working-ink: #a2c7ed;
                }
            }
            [hidden] { display: none !important; }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font:
                    15px/1.5 system-ui,
                    sans-serif;
            }
            header {
                padding: 24px 36px;
                border-bottom: 1px solid var(--line);
                display: flex;
                gap: 20px;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            h1 {
                font-size: 24px;
                letter-spacing: -0.7px;
                margin: 0;
            }
            h1 span {
                font-weight: 400;
                color: var(--muted);
            }
            .connection {
                display: flex;
                gap: 10px;
                align-items: end;
                flex-wrap: wrap;
            }
            label {
                display: block;
                font-size: 12px;
                color: var(--muted);
                margin-bottom: 10px;
            }
            input,
            textarea,
            select,
            button {
                font: inherit;
                border: 1px solid var(--line);
                border-radius: 7px;
                padding: 9px 11px;
                background: var(--paper);
                color: var(--ink);
            }
            input,
            textarea,
            select {
                width: 100%;
                display: block;
                margin-top: 4px;
            }
            input:focus,
            textarea:focus,
            select:focus,
            button:focus-visible {
                outline: 2px solid var(--green);
                outline-offset: 2px;
            }
            textarea {
                resize: vertical;
                min-height: 80px;
            }
            button {
                cursor: pointer;
                font-weight: 600;
                transition: background 0.12s;
            }
            button:hover {
                background: var(--accent);
            }
            button:disabled {
                opacity: 0.45;
                cursor: default;
            }
            .primary {
                background: var(--green);
                color: var(--primary-ink);
                border-color: var(--green);
            }
            .primary:hover {
                background: var(--primary-hover);
            }
            .connection label {
                margin: 0;
                width: 150px;
            }
            .connection input {
                font-size: 13px;
            }
            .layout {
                display: grid;
                grid-template-columns: minmax(320px, 1fr) minmax(350px, 1fr);
                max-width: 1480px;
                margin: auto;
                min-height: calc(100vh - 112px);
            }
            aside {
                padding: 28px 28px 36px 36px;
                border-right: 1px solid var(--line);
            }
            main {
                padding: 28px 36px;
            }
            .toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                margin-bottom: 16px;
            }
            h2 {
                font-size: 18px;
                margin: 0;
            }
            .filters {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .list {
                display: grid;
                gap: 9px;
            }
            .task {
                display: block;
                text-align: left;
                padding: 16px;
                width: 100%;
                border-radius: 9px;
                background: var(--paper);
                font-weight: 400;
            }
            .task[aria-pressed="true"] {
                border-color: var(--green);
                box-shadow: inset 3px 0 var(--green);
            }
            .task-title {
                display: block;
                font-size: 16px;
                font-weight: 600;
                margin: 5px 0;
            }
            .meta {
                font-size: 12px;
                color: var(--muted);
            }
            .badge {
                display: inline-block;
                border-radius: 4px;
                font: 600 11px system-ui;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                padding: 3px 6px;
                background: var(--accent);
                color: var(--green);
            }
            .badge.review {
                background: var(--warning-bg);
                color: var(--warn);
            }
            .badge.blocked {
                background: var(--blocked-bg);
                color: var(--danger);
            }
            .badge.working {
                background: var(--working-bg);
                color: var(--working-ink);
            }
            .empty {
                padding: 44px 12px;
                color: var(--muted);
                text-align: center;
            }
            .detail-title {
                font-size: 27px;
                line-height: 1.2;
                letter-spacing: -0.5px;
                margin: 12px 0;
            }
            .box {
                padding: 16px;
                background: var(--paper);
                border: 1px solid var(--line);
                border-radius: 9px;
                margin: 18px 0;
            }
            .box h3 {
                margin: 0 0 8px;
                font-size: 13px;
                color: var(--muted);
            }
            pre {
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                font:
                    13px/1.65 ui-monospace,
                    monospace;
                max-height: 420px;
                overflow: auto;
            }
            #activity:not(:empty) { padding: 8px 36px; }
            #message {
                padding: 0 36px;
                min-height: 0;
            }
            #message:not(:empty) {
                padding: 12px 36px;
                background: var(--warning-bg);
                color: var(--warn);
                border-bottom: 1px solid var(--line);
            }
            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin: 12px 0;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            details {
                margin: 16px 0;
            }
            summary {
                cursor: pointer;
                font-size: 13px;
                color: var(--green);
                font-weight: 600;
            }
            small {
                color: var(--muted);
            }
            dialog {
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 28px;
                max-width: 540px;
                width: calc(100% - 32px);
                background: var(--paper);
                color: var(--ink);
            }
            dialog::backdrop {
                background: #23332d66;
            }
            dialog h2 {
                margin-bottom: 18px;
            }
            .danger {
                color: var(--danger);
            }
            #more {
                width: 100%;
                margin-top: 12px;
            }
            footer {
                margin-top: 22px;
                color: var(--muted);
                font-size: 12px;
            }
            .meta { overflow-wrap: anywhere; }
            .grid > *, .filters > * { min-width: 0; }
            .box > .meta, .task .meta { display: block; overflow-wrap: anywhere; }
            .task-title { overflow-wrap: anywhere; }
            .preview { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
            .layout.wide .filters { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .view-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
            .view-controls label { margin: 0; }
            .layout.wide { max-width: none; grid-template-columns: minmax(0, 1fr) minmax(320px, 380px); }
            aside, main { min-width: 0; }
            .board { display: grid; grid-template-columns: repeat(6, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 12px; }
            .column { min-width: 0; }
            .column h3, .agenda-group h3 { font-size: 15px; margin: 0 0 12px; }
            .column .task, .agenda-group .task { margin-bottom: 9px; }
            .calendar-scroll { overflow-x: auto; }
            .calendar { display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); min-width: 910px; gap: 1px; background: var(--line); border: 1px solid var(--line); }
            .calendar-day { background: var(--bg); padding: 8px; min-height: 130px; }
            .calendar-day.today { box-shadow: inset 0 3px var(--green); }
            .calendar-day h3 { font-size: 12px; margin: 4px 0 8px; }
            .calendar-day .task { padding: 8px; margin-bottom: 8px; }
            .calendar-day .task-title { font-size: 13px; }
            .calendar-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
            .calendar-nav h3 { margin: 0; font-size: 16px; }
            .calendar-help { color: var(--muted); font-size: 12px; }
            .overdue { color: var(--danger); }
            @media (max-width: 800px) {
                .layout.wide { grid-template-columns: 1fr; }
                .layout.wide .filters { grid-template-columns: 1fr 1fr; }
                header {
                    padding: 20px;
                }
                .layout {
                    grid-template-columns: 1fr;
                }
                aside {
                    padding: 20px;
                    border-right: 0;
                    border-bottom: 1px solid var(--line);
                }
                main {
                    padding: 20px;
                }
                .connection {
                    width: 100%;
                }
                .connection label {
                    flex: 1;
                    min-width: 100px;
                }
                #message:not(:empty) {
                    padding: 10px 20px;
                }
                .detail-title {
                    font-size: 24px;
                }
            }
            .org-content { overflow-wrap: anywhere; }
            .org-content p { white-space: pre-wrap; }
            .org-content code { background: var(--line); padding: 1px 3px; border-radius: 3px; }
            .org-list-item label { display: flex; align-items: baseline; gap: 8px; }
            .org-list-item input[type=checkbox] { width: auto; flex: none; }
            .org-table-scroll, #entry-properties { overflow-x: auto; }
            .org-content table, #entry-properties table { width: 100%; border-collapse: collapse; }
            .org-content td, #entry-properties td, #entry-properties th { border: 1px solid var(--line); padding: 6px; text-align: left; overflow-wrap: anywhere; }
            .inline-link { background: transparent; border: 0; padding: 0; color: var(--green); text-decoration: underline; cursor: pointer; }
            .breadcrumbs { overflow-wrap: anywhere; margin-bottom: 12px; }
            .outline-node { padding-left: 12px; border-left: 1px solid var(--line); margin: 8px 0; }
            .outline-link { text-align: left; width: 100%; }
            /* Workspace layout and disclosure: content first, controls on demand. */
            body { height: 100dvh; display: flex; flex-direction: column; font-size: 14px; }
            body > header { padding: 12px 24px; flex: none; gap: 12px; }
            h1 { font-size: 21px; letter-spacing: -.5px; }
            .connection label { width: 130px; font-size: 11px; }
            .connection select, .connection input { padding: 6px 9px; font-size: 13px; }
            .layout { width: 100%; max-width: none; flex: 1; min-height: 0; grid-template-columns: minmax(320px,.85fr) minmax(0,1.15fr); overflow: hidden; }
            .layout.wide { grid-template-columns: minmax(0,1fr) minmax(380px,460px); }
            body:not(.has-selection) .layout.wide { grid-template-columns: minmax(0,1fr); }
            body:not(.has-selection) .layout.wide #detail { display: none; }
            aside, main { overflow: auto; overscroll-behavior: contain; padding: 24px; min-height: 0; }
            main { background: var(--paper); }
            .toolbar { margin-bottom: 20px; }
            .toolbar h2 { font-size: 17px; }
            button, input, select, textarea { border-radius: 6px; font-size: 14px; }
            button { min-height: 36px; }
            .view-controls { gap: 12px; margin-bottom: 16px; align-items: center; justify-content: space-between; }
            .view-tabs { display: flex; gap: 3px; padding: 3px; background: var(--line); border-radius: 8px; max-width: 100%; }
            .view-tabs button { padding: 6px 12px; border: 0; background: transparent; font-size: 13px; font-weight: 500; }
            .view-tabs button[aria-selected=true] { background: var(--paper); color: var(--green); box-shadow: 0 1px 3px #00000012; font-weight: 650; }
            #calendar-scale-label { font-size: 11px; }
            #calendar-scale { margin-top: 0; padding: 6px; }
            .search-row { display: flex; align-items: center; gap: 8px; }
            .search-label { flex: 1; margin: 0; }
            #search-filter { margin: 0; }
            .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
            .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
            .filter-chip { min-height: 28px; border: 0; border-radius: 20px; padding: 4px 9px; background: var(--accent); color: var(--green); font-size: 12px; font-weight: 500; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
            #filter-panel { padding: 16px; margin: 12px 0; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
            .filters, .layout.wide .filters { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px 12px; }
            #filter-panel .actions { margin: 4px 0 0; }
            #coverage { font-size: 11px; margin: 12px 0; }
            .list { gap: 8px; }
            .task { padding: 14px 16px; border-color: transparent; border-radius: 8px; box-shadow: 0 1px 2px #00000008; }
            .task:hover { border-color: var(--line); background: var(--paper); }
            .task[aria-pressed=true] { background: var(--accent); border-color: var(--green); box-shadow: inset 3px 0 var(--green); }
            .task-title { font-size: 15px; font-weight: 650; line-height: 1.4; margin: 8px 0 6px; }
            .task .identity { margin-bottom: 4px; }
            .task .preview { margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
            .badge { font-size: 10px; letter-spacing: .035em; padding: 3px 5px; }
            .badge.coordination { margin-left: 4px; }
            .badge.ready, .badge.note, .badge.event { background: transparent; color: var(--muted); font-weight: 500; }
            .detail-header { position: sticky; top: -24px; margin: -24px -24px 20px; padding: 20px 24px 12px; background: var(--paper); border-bottom: 1px solid var(--line); z-index: 3; }
            .detail-title { font-size: 26px; line-height: 1.25; margin: 10px 0 6px; letter-spacing: -.6px; }
            .detail-title:focus { outline: none; }
            .detail-header > .meta { font-size: 12px; }
            .detail-header .actions { margin: 8px 0 0; align-items: center; }
            .detail-metadata { display: flex; flex-wrap: wrap; gap: 5px 16px; padding: 0 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
            .detail-metadata .meta { font-size: 12px; }
            .state-controls { display: flex; align-items: end; gap: 8px; margin-top: 12px; }
            .state-controls label { margin: 0; max-width: 180px; font-size: 11px; }
            .state-controls select { padding: 7px 10px; min-width: 110px; }
            .state-controls button { padding: 7px 10px; font-size: 12px; }
            .box { padding: 18px 0; border: 0; border-radius: 0; background: transparent; margin: 0; border-bottom: 1px solid var(--line); }
            .box h3 { color: var(--ink); font-size: 14px; font-weight: 650; }
            .breadcrumbs { font-size: 12px; margin-bottom: 8px; }
            #entry-content { padding-top: 8px; }
            #entry-content > .actions { gap: 4px; margin: 10px 0 14px; }
            #entry-content > .actions button { min-height: 30px; font-size: 12px; padding: 5px 9px; border: 0; background: transparent; color: var(--muted); }
            #entry-content > .actions button[aria-pressed=true] { background: var(--accent); color: var(--green); }
            .org-content { font-size: 15px; line-height: 1.7; }
            .org-content a { color: var(--green); }
            .org-list-item { margin: 6px 0; }
            .org-list-item label { margin-bottom: 0; font-size: 14px; color: var(--ink); }
            .org-content pre { background: var(--bg); padding: 12px; border-radius: 6px; }
            .org-content td, #entry-properties td, #entry-properties th { font-size: 13px; padding: 8px; }
            .inline-status { color: var(--green); font-size: 12px; margin-left: 8px; }
            .inline-status:empty { display: none; }
            details.box { margin: 0; }
            summary { font-size: 13px; padding: 4px 0; }
            .outline-node { margin: 8px 0; }
            .outline-link { border: 0; font-size: 13px; padding: 6px 8px; background: transparent; }
            #detail > details { border-top: 1px solid var(--line); margin: 0; padding: 16px 0; }
            .task-menu { position: relative; margin: 0 0 0 auto; }
            .task-menu > summary { list-style: none; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-size: 12px; }
            .task-menu > summary::-webkit-details-marker { display: none; }
            .task-menu-items { position: absolute; right: 0; top: calc(100% + 6px); width: min(280px,75vw); padding: 6px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 8px 28px #00000020; border-radius: 8px; z-index: 5; display: grid; gap: 3px; }
            .task-menu-items button { text-align: left; background: transparent; border: 0; font-size: 13px; }
            .task-menu-items button:hover { background: var(--accent); }
            .evidence-panel { background: var(--bg); border: 1px solid var(--line); padding: 16px; border-radius: 8px; margin: 12px 0; }
            .evidence-panel h3 { margin: 0 0 10px; font-size: 14px; }
            #message-home { flex: none; }
            #message:not(:empty) { background: var(--accent); color: var(--ink); padding: 10px 14px; border: 0; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
            #message[data-kind=error]:not(:empty) { background: var(--blocked-bg); color: var(--danger); }
            #message[data-kind=success]:not(:empty) { color: var(--green); }
            #message-home #message:not(:empty) { margin: 8px 24px; }
            #activity:not(:empty) { padding: 4px 0 10px; font-size: 12px; }
            #message-home #activity:not(:empty) { padding: 4px 24px; }
            #conflict-recovery { margin: 0 0 16px; }
            footer { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; font-size: 11px; padding: 18px 0 4px; }
            .footer-actions { display: flex; gap: 6px; }
            footer button { font-size: 11px; padding: 5px 8px; min-height: 30px; }
            .column h3 { font-size: 13px; }
            .column > .actions { margin: 8px 0; gap: 4px; }
            .column > .actions button { min-height: 30px; padding: 4px 9px; }
            .back-to-list { display: none; }
            @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
            @media (max-width: 800px) {
                body > header { padding: 12px 16px; }
                .connection { width: auto; }
                .connection label { width: 100px; min-width: 0; }
                .layout, .layout.wide { display: block; }
                aside, main { height: 100%; padding: 16px; }
                main { display: none; }
                body.detail-open aside, body.detail-open > header { display: none; }
                body.detail-open main { display: block; }
                .detail-header { top: -16px; margin: -16px -16px 16px; padding: 12px 16px; }
                .back-to-list { display: block; padding: 4px 0; border: 0; background: transparent; font-size: 13px; color: var(--green); margin-bottom: 8px; }
                .detail-title { font-size: 23px; }
                .view-tabs { width: 100%; }
                .view-tabs button { flex: 1; padding: 6px; min-height: 40px; }
                button, select, summary { min-height: 40px; }
                .filters, .layout.wide .filters { grid-template-columns: 1fr; }
                .calendar-help { font-size: 12px; }
                .state-controls select, .state-controls button { min-height: 40px; }
                .task-menu > summary { display: flex; align-items: center; }
                .task-menu-items { max-height: 60dvh; overflow: auto; }
                #entry-content > .actions button { min-height: 40px; }
            }

        </style>
    </head>
    <body>
        <header>
            <div>
                <h1>Org <span>/ Tasks</span></h1>
            </div>
            <div class="connection">
                <label>Theme<select id="theme">
                    <option value="system">System</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select></label>
                <label
                    >Your name<input
                        id="actor"
                        placeholder="Name for task history"
                        title="Used to record your changes and claims; this is not a login."
                        autocomplete="off" /></label
                ><label id="token-label" hidden
                    >Access token<input
                        id="token"
                        type="password"
                        autocomplete="off" /></label
                ><button id="connect" class="primary" hidden>Unlock workspace</button>
            </div>
        </header>
        <div id="message-home"><div id="message" role="status" aria-live="polite"></div><div id="activity" class="meta" role="status" aria-live="polite"></div></div>
        <div class="layout">
            <aside>
                <div class="toolbar">
                    <h2>Work queue <small id="count"></small></h2>
                    <button id="new" class="primary" disabled>+ New task</button>
                </div>
                <div class="view-controls">
                    <div class="view-tabs" role="tablist" aria-label="Task view">
                        <button id="tab-list" role="tab" aria-selected="true" aria-controls="list" data-view="list">List</button>
                        <button id="tab-board" role="tab" aria-selected="false" aria-controls="list" tabindex="-1" data-view="board">Board</button>
                        <button id="tab-agenda" role="tab" aria-selected="false" aria-controls="list" tabindex="-1" data-view="agenda">Agenda</button>
                        <button id="tab-calendar" role="tab" aria-selected="false" aria-controls="list" tabindex="-1" data-view="calendar">Calendar</button>
                    </div>
                    <label hidden>Layout<select id="view">
                        <option value="list">List</option><option value="board">Board</option>
                        <option value="agenda">Agenda</option><option value="calendar">Calendar</option>
                    </select></label>

            }
            function timestampInput(stamp) {

            const eventLabel = event => (event.projected ? "Projected " : "") + ({deadline:"Deadline", scheduled:"Scheduled", appointment:"Appointment"}[event.kind]) + ": " + dateLabel(event.stamp);
            async function load(more = false, minimumCount = 0) {

                        owner: $("owner-filter").value,
                        file: $("file-filter").value,

            function plainPreview(text) {

            function planningEvents(tasks, from, through) {

                    for (const {kind, stamp} of source) {

                const evidenceTitle = el("h3", "Evidence or feedback"), confirmEvidence = el("button", "Confirm", "primary"), closeEvidence = el("button", "Close");
                confirmEvidence.dataset.write = "true"; let pendingEvidenceAction = null;
                confirmEvidence.onclick = () => run(() => act(pendingEvidenceAction));
                closeEvidence.onclick = () => { evidencePanel.hidden = true; heading.querySelector("button:not(.back-to-list)")?.focus(); };
                const evidenceActions = el("div", undefined, "actions"); evidenceActions.append(confirmEvidence,closeEvidence);
                evidencePanel.append(evidenceTitle,evidence,evidenceActions); root.append(evidencePanel);
                function openEvidence(action, label) {
                    pendingEvidenceAction = action; evidenceTitle.textContent = label || "Evidence or feedback";
                    confirmEvidence.textContent = label ? "Confirm " + label.toLowerCase() : "Confirm"; confirmEvidence.hidden = !action;
                    evidencePanel.hidden = false; feedback.after(evidencePanel); more.open = false; $("evidence").focus();
                }
                const addEvidence = el("button", "Add evidence or feedback"); addEvidence.onclick = () => openEvidence(null); menu.append(addEvidence);
                const actions = el("div", undefined, "actions");
                function button(label, action, cls = "") {
                    const b = el("button", label, cls);
                    b.dataset.write = "true";
                    b.disabled = !canWrite;
                    b.onclick = () => {
                        if (["submit","approve","reject"].includes(action) && !$("evidence").value.trim()) { openEvidence(action,label); return; }
                        run(() => act(action));
                    };
                    if (["cancel","renew","release","reopen"].includes(action)) menu.append(b); else actions.append(b);
                }
                if (row.status === "ready")
                    button("Claim task", "claim", "primary");
                if (row.status === "working") {
                    if (!row.claim_stale) {
                        button("Submit work", "submit", "primary");
                        button("Renew claim", "renew");
                    }
                    button("Release", "release");
                }
                if (row.status === "review") {
                    if (!row.submission_stale)
                        button("Approve", "approve", "primary");
                    button("Request changes", "reject");
                }
                if (row.claim_stale || row.submission_stale)
                    button("Reset stale workflow", "reopen");
                if (["done", "cancelled"].includes(row.status))
                    button("Reopen", "reopen");
                else button("Cancel task", "cancel", "danger");
                actions.append(more); heading.append(actions);
                // Content and subheadings precede optional acceptance, coordination and inspection sections.
                const rich = el("div", undefined, "rich-details"); renderRichDetail(rich, row);
                root.insertBefore(rich, summary.nextSibling);
                const criteriaAnchor = rich.querySelector("#entry-content");
                if (row.acceptance && criteriaAnchor) criteriaAnchor.after(criteria);
                if (!evidencePanel.hidden) feedback.after(evidencePanel);
                if (row.claimed_by)
                    root.append(
                        el(
                            "small",
                            "Claimed by " +
                                row.claimed_by +
                                " until " +
                                row.claim_until,
                        ),
                    );
                const contract = el("details");
                contract.append(el("summary", "Task settings"));
                rememberExpansion(contract, "detail-" + row.ref + "-settings");
                const form = el("form");
                form.append(
                    labelled("Title", "edit-title", row.title),
                    labelled("Description", "edit-text", row.description, "textarea"),
                    labelled("Local tags (inherited tags are shown above)", "edit-tags", row.tags.join(" ")),
                    labelled("Priority (A–Z)", "edit-priority", row.priority),
                    labelled("Scheduled (planned date/time)", "edit-scheduled", timestampInput(row.scheduled)),
                    labelled("Deadline (latest completion date/time)", "edit-deadline", timestampInput(row.deadline)),
                    labelled(
                        "Acceptance criteria",
                        "edit-acceptance",
                        row.acceptance,
                    ),
                    labelled("Project", "edit-project", row.project),
                    labelled("Assigned actor", "edit-owner", row.owner),
                    labelled(
                        "Dependency IDs (space separated)",
                        "edit-deps",
                        row.depends_on.join(" "),
                    ),
                );
                const review = el(
                        "label",
                        "Require review by a different actor",
                    ),
                    select = el("select");
                select.id = "edit-review";
                for (const [v, t] of [
                    ["true", "Yes"],
                    ["false", "No"],
                ]) {
                    const o = el("option", t);
                    o.value = v;
                    select.append(o);
                }
                select.value = String(row.review_required);
                review.append(select);
                form.append(review);
                const save = el("button", "Save settings");
                save.dataset.write = "true";
                save.disabled = !canWrite;
                const fieldStatus = el("span", "", "inline-status"); fieldStatus.id = "field-status"; fieldStatus.setAttribute("role","status"); form.append(save,fieldStatus);
                form.onsubmit = (e) => {
                    e.preventDefault();
                    run(async () => {
                        const args = {ref: fetched.ref, expected_revision: fetched.revision, actor: actor()};
                        for (const [key, id, old] of [
                            ["title", "edit-title", row.title], ["text", "edit-text", row.description],
                            ["tags", "edit-tags", row.tags.join(" ")], ["priority", "edit-priority", row.priority],
                            ["scheduled", "edit-scheduled", timestampInput(row.scheduled)],
                            ["deadline", "edit-deadline", timestampInput(row.deadline)],
                            ["acceptance", "edit-acceptance", row.acceptance], ["project", "edit-project", row.project], ["owner", "edit-owner", row.owner]
                        ]) if ($(id).value !== old) args[key] = $(id).value;
                        if ($("edit-deps").value !== row.depends_on.join(" ")) args.depends_on = $("edit-deps").value.trim().split(/\s+/).filter(Boolean);
                        if ($("edit-review").value !== String(row.review_required)) args.review_required = $("edit-review").value === "true";
                        if (Object.keys(args).length === 3) { message("No changes to save."); return; }
                        fieldStatus.textContent = "Saving…";
                        const result = await request("task_update", args);
                        await afterWrite(result);
                        if ($("field-status")) $("field-status").textContent = "Saved";
                        message(result.warning || "Task saved.");
                    });
                };
                form.append(el("p", "Dates accept YYYY-MM-DD, YYYY-MM-DDTHH:mm, or full Org syntax: <2030-01-01 09:00 +1w -2d>--<2030-01-02 10:00>. Edit repeaters, warning/delay offsets and range endpoints here; empty clears the timestamp.", "meta"));
                contract.append(form);
                root.append(contract);
                const move = el("details"); move.append(el("summary", "Move to another file or heading"));
                const destination = labelled("Destination file", "move-file", row.file); destination.lastChild.setAttribute("list", "workspace-files");
                const parent = labelled("Parent heading", "move-parent", "", "select");
                move.append(destination, parent);
                const moveButton = el("button", "Move task"); moveButton.dataset.write = "true"; moveButton.disabled = !canWrite;
                moveButton.onclick = () => run(async () => {
                    const file = $("move-file").value.trim();
                    const metadata = workspace.files.find(candidate => candidate.file === file);
                    if (!metadata) throw Error("Choose an existing destination file so its workflow and revision can be checked.");
                    const result = await request("task_move", {ref: fetched.ref, expected_revision: fetched.revision, actor: actor(), file, parent: $("move-parent").value, destination_revision: metadata.revision});
                    await loadWorkspace(); await afterWrite(result); message("Task moved.");
                });
                move.append(moveButton); root.append(move);
                destination.lastChild.onchange = () => destinationFields("move");
                move.ontoggle = () => { if (move.open && move.isConnected) read(async () => { await loadWorkspace(); if (move.isConnected) destinationFields("move"); }); };
                const source = el("details");
                source.append(
                    el("summary", "Source Org"),
                    el("pre", fetched.text),
                );
                root.append(source);
                if (!canWrite)
                    root.append(el("p", "Read-only workspace.", "meta"));
            }
            async function afterWrite(result) {
                if (result.warning) message(result.warning);
                if (result.undo) { workspace.undo = result.undo; $("undo").disabled = !canWrite || !result.undo.token; }
                await load();
                await choose(result);
            }
            async function act(action) {
                const who = actor(),
                    evidence = $("evidence").value;
                const args = {
                    ref: fetched.ref,
                    expected_revision: fetched.revision,
                    actor: who,
                    action,
                };
                if (action === "claim") {
                    if (
                        !claimRequest ||
                        claimRequest.ref !== args.ref ||
                        claimRequest.actor !== who
                    )
                        claimRequest = {
                            ref: args.ref,
                            actor: who,
                            id: crypto.randomUUID(),
                        };
                    args.claim_id = claimRequest.id;
                } else if (["renew", "release", "submit"].includes(action)) {
                    if (selected.claimed_by !== who)
                        throw Error(
                            "This task is claimed by " +
                                selected.claimed_by +
                                ". Use that actor or wait for the lease to expire.",
                        );
                    args.claim_id = property("TASK_CLAIM_ID");
                    if (!args.claim_id)
                        throw Error(
                            "Claim details changed. Refresh before continuing.",
                        );
                }
                if (
                    ["submit", "approve", "reject"].includes(
                        action,
                    ) &&
                    !evidence.trim()
                )
                    throw Error("Add evidence or a reason before continuing.");
                if (
                    [
                        "submit",
                        "approve",
                        "reject",
                        "cancel",
                        "release",
                        "reopen",
                    ].includes(action)
                )
                    args.evidence = evidence;
                if (action === "cancel") $("activity").textContent = "Cancelling task…";
                const result = await request("task_action", args);
                claimRequest = null;
                if (action === "cancel") $("activity").textContent = "Updating task list…";
                await afterWrite(result);
                if (action === "cancel") message("Task cancelled." + (result.warning ? " " + result.warning : ""));
                else message(result.warning || ({claim:"Task claimed.",renew:"Claim renewed.",release:"Claim released.",submit:result.status === "review" ? "Submitted for review." : "Work submitted.",approve:"Submission approved.",reject:"Changes requested.",reopen:"Task reopened."}[action] || "Saved."), result.warning ? "info" : "success");
            }
            async function connect() {
                const tools = await request("tools");
                canWrite = tools.some(
                    (t) => (t.name ?? t.Name) === "task_action",
                );
                $("new").disabled = !canWrite;
                $("refresh").disabled = false;
                await loadWorkspace(true);
                await load();
                connected = true;
                $("token-label").hidden = true;
                $("connect").hidden = true;
                if (selected) {
                    if (draftDirty) { message("Workspace loaded. Your draft is preserved."); return; }
                    const current = rows.find((r) => r.ref === selected.ref);
                    if (current) await choose(current);
                    else {
                        parkFeedback();
                        document.body.classList.remove("has-selection", "detail-open");
                        fetched = null;
                        $("detail").replaceChildren(
                            el("p", "Select a task from this view.", "empty"),
                        );
                        selected = null;
                    }
                }
            }
            $("connect").onclick = () => read(connect);
            $("token").onkeydown = (event) => {
                if (event.key === "Enter") read(connect);
            };
            $("detail").addEventListener("input", () => {
                draftDirty = true;
            });
            $("detail").addEventListener("change", () => {
                draftDirty = true;
            });
            async function refreshView() {
                // Preserve all loaded pages, so polling does not collapse pagination.
                const count = Math.max(rows.length, 50);
                await loadWorkspace();
                await load(false, count);
                if (!selected) return;
                let current = rows.find((r) => r.ref === selected.ref);
                if (!current && selected._outline) {
                    try { current = await request("entry_details", {ref:selected.ref}); } catch (error) { if (draftDirty) { message("The heading changed or was removed; your draft is preserved."); return; } throw error; }
                }
                if (draftDirty) {
                    if (!current || current.revision !== fetched?.revision)
                        message(
                            "This task changed outside the board. Your draft is preserved; select the task again to load its current version before submitting.",
                        );
                    return; // Keep the original revision: never submit a draft against unseen edits.
                }
                if (current) {
                    if (
                        current.revision !== fetched?.revision ||
                        current.status !== selected.status || current.claimed_by !== selected.claimed_by || current.claim_expired !== selected.claim_expired || current.claim_stale !== selected.claim_stale || current.submission_stale !== selected.submission_stale
                    )
                        await choose(current, true);
                } else {
                    selected = null;
                    fetched = null;
                    parkFeedback(); document.body.classList.remove("has-selection","detail-open");
                    $("detail").replaceChildren(
                        el(
                            "p",
                            "This task is no longer in this view. It may have moved, changed status, or been deleted.",
                            "empty",
                        ),
                    );
                }
            }
            function parkFeedback() {
                $("message-home").append($("message"), $("activity"));
            }
            function returnToList() {
                document.body.classList.remove("detail-open"); parkFeedback();
                const task = [...document.querySelectorAll("#list .task")].find(node => node.getAttribute("aria-pressed") === "true");
                (task || $("tab-" + $("view").value)).focus({preventScroll:true});
            }
            function syncViewControls() {
                const view = $("view").value;
                for (const tab of document.querySelectorAll("[data-view]")) {
                    tab.setAttribute("aria-selected", String(tab.dataset.view === view)); tab.tabIndex = tab.dataset.view === view ? 0 : -1;
                }
                $("list").setAttribute("aria-labelledby", "tab-" + view);
                const chips = $("active-filters"); chips.replaceChildren();
                const filters = [["status","Coordination","all"],["project-filter","Project",""],["owner-filter","Owner",""],["file-filter","File",""],["workflow-filter","Workflow",""],["state-filter","State",""]];
                let count = 0;
                for (const [id,label,empty] of filters) {
                    const input = $(id); if (input.value === empty) continue; count++;
                    const value = input.selectedOptions?.[0]?.textContent || input.value;
                    const chip = el("button", (id === "status" ? value : label + ": " + value) + " ×", "filter-chip");
                    chip.setAttribute("aria-label", "Remove " + label.toLowerCase() + " filter");
                    chip.onclick = () => { input.value = empty; read(() => load()); }; chips.append(chip);
                }
                $("filters-toggle").textContent = "Filters" + (count ? " · " + count : "");
            }
            $("filters-toggle").onclick = () => {
                const open = $("filter-panel").hidden; $("filter-panel").hidden = !open; $("filters-toggle").setAttribute("aria-expanded",String(open));
                if (open) $("status").focus();
            };
            for (const tab of document.querySelectorAll("[data-view]")) {
                tab.onclick = () => { $("view").value = tab.dataset.view; read(async () => { if (connected) await load(); else renderList(); }); };
                tab.onkeydown = event => {
                    const tabs = [...document.querySelectorAll("[data-view]")], index = tabs.indexOf(tab);
                    const next = event.key === "ArrowRight" ? (index + 1) % tabs.length : event.key === "ArrowLeft" ? (index + tabs.length - 1) % tabs.length : event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 : null;
                    if (next !== null) { event.preventDefault(); tabs[next].focus(); tabs[next].click(); }
                };
            }
            document.addEventListener("keydown", event => {
                if ($("create-dialog").open) return;
                const typing = event.target.closest("input,textarea,select,[contenteditable=true]");
                if (event.key === "/" && !typing && !event.ctrlKey && !event.metaKey && !event.altKey) { event.preventDefault(); returnToList(); $("search-filter").focus(); }
                if (event.key === "Escape") {
                    if (!$("filter-panel").hidden) { $("filter-panel").hidden = true; $("filters-toggle").setAttribute("aria-expanded","false"); $("filters-toggle").focus(); }
                    else if ($("task-actions")?.open) { $("task-actions").open = false; $("task-actions").querySelector("summary").focus(); }
                    else if (!typing && matchMedia("(max-width: 800px)").matches) returnToList();
                }
            });

            $("refresh").onclick = () => read(async () => { await loadWorkspace(); await refreshView(); });
            // Poll only while visible, connected and idle. Do not touch the creation dialog.
            setInterval(() => {
                if (
                    connected &&
                    !busy &&
                    !document.hidden &&
                    !$("create-dialog").open
                )
                    run(refreshView, true);
            }, 3000);
            $("status").onchange = () => read(() => load());
            $("project-filter").onchange = () => read(() => load());
            $("owner-filter").onchange = () => read(() => load());
            $("search-filter").onchange = () => read(() => load());
            $("view").onchange = () => read(async () => { if (connected) await load(); else renderList(); });
            $("calendar-scale").onchange = renderList;
            $("more").onclick = () => read(() => load(true));
            $("new").onclick = () => read(async () => {
                await loadWorkspace();
                createRequest = crypto.randomUUID();
                $("create-file").value = $("file-filter").value || selected?.file || "";
                destinationFields("create");
                $("create-feedback").textContent = "";
                $("create-dialog").showModal();
                $("create-title").focus();
            });
            $("create-file").onchange = () => destinationFields("create");
            $("create-owner").onchange = () => { if (!$("create-file").value.trim()) destinationFields("create"); };
            $("create-cancel").onclick = () => $("create-dialog").close();
            $("create-form").onsubmit = (e) => {
                e.preventDefault();
                run(async () => {
                    const result = await request("task_create", {
                        request_id: createRequest,
                        ...($("create-file").value.trim() ? {file: $("create-file").value.trim()} : {}),
                        parent: $("create-parent").value,
                        state: $("create-state").value || "TODO",
                        ...(workspace.files.find(file => file.file === creationFile()) ? {destination_revision: workspace.files.find(file => file.file === creationFile()).revision} : {}),
                        title: $("create-title").value,
                        actor: actor(),
                        acceptance: $("create-acceptance").value,
                        project: $("create-project").value,
                        owner: $("create-owner").value,
                        text: $("create-text").value,
                    });
                    $("create-dialog").close();
                    $("create-form").reset();
                    await loadWorkspace();
                    await afterWrite(result);
                    message(result.warning || "Task created.");
                });
            };
            async function changeState(row, state) {
                if (row.state === state) return;
                if (!row.states.includes(state)) throw Error("This file does not define " + state + ". Choose one of its configured states.");
                const result = await request("task_action", {ref: row.ref, expected_revision: row.revision, actor: actor(), action: "state", state});
                await afterWrite(result); message(result.warning || (result.state === state ? "State saved as " + result.state + "." : "Occurrence completed; file state is " + result.state + ". " + [result.scheduled ? "Next scheduled: " + dateLabel(result.scheduled) : "", result.deadline ? "Next deadline: " + dateLabel(result.deadline) : ""].filter(Boolean).join(" ")));
            }
            async function reorderColumn(order, from, to) {
                const next = [...order]; next.splice(next.indexOf(from), 1); next.splice(order.indexOf(to), 0, from);
                const saved = await request("board_settings", {expected_revision: workspace.revision, settings: {...workspace.settings, column_order: next}});
                workspace.settings = saved.settings; workspace.revision = saved.revision; renderList(); message("Column order saved.");
            }
            for (const id of ["file-filter", "state-filter", "workflow-filter"]) $(id).onchange = () => read(() => load());
            $("calendar-scale").onchange = () => { savePreferences(); renderList(); };
            $("save-view").onclick = () => { const name = prompt("Name this view"); if (!name?.trim() || !workspace) return; savedViews = {...savedViews, [name.trim()]: currentPreferences()}; savePreferences(); refreshSavedViews(); message("View saved in this browser."); };
            $("saved-view").onchange = () => { const prefs = savedViews[$("saved-view").value]; if (prefs) { applyPreferences(prefs); read(() => load()); } };
            $("delete-view").onclick = () => { delete savedViews[$("saved-view").value]; savePreferences(); refreshSavedViews(); };
            $("undo").onclick = () => run(async () => {
                if (!workspace.undo?.token) return;
                await request("task_undo", {token: workspace.undo.token, actor: actor()});
                selected = null; fetched = null; draftDirty = false; parkFeedback(); document.body.classList.remove("has-selection","detail-open"); $("detail").replaceChildren(el("p", "Change undone. Select a task to continue.", "empty"));
                await loadWorkspace(); await load(); message("Last change undone.");
            });
            run(connect);
        </script>
    </body>
</html>
