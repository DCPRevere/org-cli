<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Org · Tasks</title>
        <script>
            // Apply the saved preference before painting; storage may be unavailable.
            try {
                const theme = localStorage.getItem("org-theme");
                if (theme === "light" || theme === "dark")
                    document.documentElement.dataset.theme = theme;
            } catch {}
        </script>
        <style>
            :root {
                color-scheme: light;
                --bg: #f6f5f1;
                --paper: #fffefa;
                --ink: #23332d;
                --muted: #647168;
                --line: #dce1d9;
                --green: #23624c;
                --accent: #eaf2eb;
                --warn: #94620e;
                --primary-ink: #ffffff;
                --primary-hover: #194b39;
                --warning-bg: #fff0cf;
                --blocked-bg: #f7e8e4;
                --danger: #983b2d;
                --working-bg: #e5eef7;
                --working-ink: #335d86;
            }
            :root[data-theme="dark"] {
                color-scheme: dark;
                --bg: #151b18;
                --paper: #1e2722;
                --ink: #e5ece6;
                --muted: #a6b5aa;
                --line: #405047;
                --green: #8ad5ad;
                --accent: #293e32;
                --warn: #f0ca80;
                --primary-ink: #14291e;
                --primary-hover: #a7e5c3;
                --warning-bg: #3d3220;
                --blocked-bg: #402923;
                --danger: #f2a18f;
                --working-bg: #25374a;
                --working-ink: #a2c7ed;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    color-scheme: dark;
                    --bg: #151b18;
                    --paper: #1e2722;
                    --ink: #e5ece6;
                    --muted: #a6b5aa;
                    --line: #405047;
                    --green: #8ad5ad;
                    --accent: #293e32;
                    --warn: #f0ca80;
                    --primary-ink: #14291e;
                    --primary-hover: #a7e5c3;
                    --warning-bg: #3d3220;
                    --blocked-bg: #402923;
                    --danger: #f2a18f;
                    --working-bg: #25374a;
                    --working-ink: #a2c7ed;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font:
                    15px/1.5 system-ui,
                    sans-serif;
            }
            header {
                padding: 24px 36px;
                border-bottom: 1px solid var(--line);
                display: flex;
                gap: 20px;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            h1 {
                font-size: 24px;
                letter-spacing: -0.7px;
                margin: 0;
            }
            h1 span {
                font-weight: 400;
                color: var(--muted);
            }
            .connection {
                display: flex;
                gap: 10px;
                align-items: end;
                flex-wrap: wrap;
            }
            label {
                display: block;
                font-size: 12px;
                color: var(--muted);
                margin-bottom: 10px;
            }
            input,
            textarea,
            select,
            button {
                font: inherit;
                border: 1px solid var(--line);
                border-radius: 7px;
                padding: 9px 11px;
                background: var(--paper);
                color: var(--ink);
            }
            input,
            textarea,
            select {
                width: 100%;
                display: block;
                margin-top: 4px;
            }
            input:focus,
            textarea:focus,
            select:focus,
            button:focus-visible {
                outline: 2px solid var(--green);
                outline-offset: 2px;
            }
            textarea {
                resize: vertical;
                min-height: 80px;
            }
            button {
                cursor: pointer;
                font-weight: 600;
                transition: background 0.12s;
            }
            button:hover {
                background: var(--accent);
            }
            button:disabled {
                opacity: 0.45;
                cursor: default;
            }
            .primary {
                background: var(--green);
                color: var(--primary-ink);
                border-color: var(--green);
            }
            .primary:hover {
                background: var(--primary-hover);
            }
            .connection label {
                margin: 0;
                width: 150px;
            }
            .connection input {
                font-size: 13px;
            }
            .layout {
                display: grid;
                grid-template-columns: minmax(320px, 1fr) minmax(350px, 1fr);
                max-width: 1480px;
                margin: auto;
                min-height: calc(100vh - 112px);
            }
            aside {
                padding: 28px 28px 36px 36px;
                border-right: 1px solid var(--line);
            }
            main {
                padding: 28px 36px;
            }
            .toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                margin-bottom: 16px;
            }
            h2 {
                font-size: 18px;
                margin: 0;
            }
            .filters {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .list {
                display: grid;
                gap: 9px;
            }
            .task {
                display: block;
                text-align: left;
                padding: 16px;
                width: 100%;
                border-radius: 9px;
                background: var(--paper);
                font-weight: 400;
            }
            .task[aria-pressed="true"] {
                border-color: var(--green);
                box-shadow: inset 3px 0 var(--green);
            }
            .task-title {
                display: block;
                font-size: 16px;
                font-weight: 600;
                margin: 5px 0;
            }
            .meta {
                font-size: 12px;
                color: var(--muted);
            }
            .badge {
                display: inline-block;
                border-radius: 4px;
                font: 600 11px system-ui;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                padding: 3px 6px;
                background: var(--accent);
                color: var(--green);
            }
            .badge.review {
                background: var(--warning-bg);
                color: var(--warn);
            }
            .badge.blocked {
                background: var(--blocked-bg);
                color: var(--danger);
            }
            .badge.working {
                background: var(--working-bg);
                color: var(--working-ink);
            }
            .empty {
                padding: 44px 12px;
                color: var(--muted);
                text-align: center;
            }
            .detail-title {
                font-size: 27px;
                line-height: 1.2;
                letter-spacing: -0.5px;
                margin: 12px 0;
            }
            .box {
                padding: 16px;
                background: var(--paper);
                border: 1px solid var(--line);
                border-radius: 9px;
                margin: 18px 0;
            }
            .box h3 {
                margin: 0 0 8px;
                font-size: 13px;
                color: var(--muted);
            }
            pre {
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                font:
                    13px/1.65 ui-monospace,
                    monospace;
                max-height: 420px;
                overflow: auto;
            }
            #message {
                padding: 0 36px;
                min-height: 0;
            }
            #message:not(:empty) {
                padding: 12px 36px;
                background: var(--warning-bg);
                color: var(--warn);
                border-bottom: 1px solid var(--line);
            }
            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin: 12px 0;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            details {
                margin: 16px 0;
            }
            summary {
                cursor: pointer;
                font-size: 13px;
                color: var(--green);
                font-weight: 600;
            }
            small {
                color: var(--muted);
            }
            dialog {
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 28px;
                max-width: 540px;
                width: calc(100% - 32px);
                background: var(--paper);
                color: var(--ink);
            }
            dialog::backdrop {
                background: #23332d66;
            }
            dialog h2 {
                margin-bottom: 18px;
            }
            .danger {
                color: var(--danger);
            }
            #more {
                width: 100%;
                margin-top: 12px;
            }
            footer {
                margin-top: 22px;
                color: var(--muted);
                font-size: 12px;
            }
            .meta { overflow-wrap: anywhere; }
            .grid > *, .filters > * { min-width: 0; }
            .box > .meta, .task .meta { display: block; overflow-wrap: anywhere; }
            .task-title { overflow-wrap: anywhere; }
            .preview { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
            .view-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
            .view-controls label { margin: 0; }
            .layout.wide { max-width: none; grid-template-columns: minmax(0, 1fr) minmax(320px, 380px); }
            aside, main { min-width: 0; }
            .board { display: grid; grid-template-columns: repeat(6, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 12px; }
            .column { min-width: 0; }
            .column h3, .agenda-group h3 { font-size: 15px; margin: 0 0 12px; }
            .column .task, .agenda-group .task { margin-bottom: 9px; }
            .calendar-scroll { overflow-x: auto; }
            .calendar { display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); min-width: 910px; gap: 1px; background: var(--line); border: 1px solid var(--line); }
            .calendar-day { background: var(--bg); padding: 8px; min-height: 130px; }
            .calendar-day.today { box-shadow: inset 0 3px var(--green); }
            .calendar-day h3 { font-size: 12px; margin: 4px 0 8px; }
            .calendar-day .task { padding: 8px; margin-bottom: 8px; }
            .calendar-day .task-title { font-size: 13px; }
            .calendar-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
            .calendar-nav h3 { margin: 0; font-size: 16px; }
            .calendar-help { color: var(--muted); font-size: 12px; }
            .overdue { color: var(--danger); }
            @media (max-width: 800px) {
                .layout.wide { grid-template-columns: 1fr; }
                header {
                    padding: 20px;
                }
                .layout {
                    grid-template-columns: 1fr;
                }
                aside {
                    padding: 20px;
                    border-right: 0;
                    border-bottom: 1px solid var(--line);
                }
                main {
                    padding: 20px;
                }
                .connection {
                    width: 100%;
                }
                .connection label {
                    flex: 1;
                    min-width: 100px;
                }
                #message:not(:empty) {
                    padding: 10px 20px;
                }
                .detail-title {
                    font-size: 24px;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div>
                <h1>Org <span>/ Tasks</span></h1>
            </div>
            <div class="connection">
                <label>Theme<select id="theme">
                    <option value="system">System</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select></label>
                <label
                    >Your actor name<input
                        id="actor"
                        placeholder="daniel"
                        autocomplete="off" /></label
                ><label
                    >Access token, if configured<input
                        id="token"
                        type="password"
                        autocomplete="off" /></label
                ><button id="connect" class="primary">Connect</button>
            </div>
        </header>
        <div id="message" role="status" aria-live="polite"></div>
        <div class="layout">
            <aside>
                <div class="toolbar">
                    <h2>Work queue <small id="count"></small></h2>
                    <button id="new" disabled>+ New task</button>
                </div>
                <div class="view-controls">
                    <label>Layout<select id="view">
                        <option value="list">List</option><option value="board">Board</option>
                        <option value="agenda">Agenda</option><option value="calendar">Calendar</option>
                    </select></label>
                    <label id="calendar-scale-label" hidden>Calendar range<select id="calendar-scale">
                        <option value="month">Month</option><option value="week">Week</option>
                    </select></label>
                </div>
                <div class="filters">
                    <label
                        >Status<select id="status">
                            <option value="open">All open work</option>
                            <option value="ready">Ready to start</option>
                            <option value="working">In progress</option>
                            <option value="review">Needs review</option>
                            <option value="blocked">Blocked</option>
                            <option value="done">Completed</option>
                            <option value="cancelled">Cancelled</option>
                            <option value="all">Everything</option>
                        </select></label
                    ><label
                        >Project<input
                            id="project-filter"
                            placeholder="All projects"
                    /></label>
                </div>
                <div class="filters">
                    <label>Owner<input id="owner-filter" placeholder="All owners" /></label>
                    <label>Search<input id="search-filter" type="search" placeholder="Title, file, tag or context" /></label>
                </div>
                <p id="coverage" class="meta" role="status"></p>
                <div id="list" class="list">
                    <p class="empty">Connect to load your workspace.</p>
                </div>
                <button id="more" hidden>Load more</button>
                <footer>
                    Org files hold the work and its history. The server watches
                    external edits.
                    <button id="refresh" disabled>Refresh</button>
                </footer>
            </aside>
            <main id="detail">
                <div class="empty">
                    <h2>A clear next step.</h2>
                    <p>
                        Choose a task to see its context, acceptance criteria,
                        and ownership.
                    </p>
                </div>
            </main>
        </div>
        <dialog id="create-dialog">
            <form id="create-form">
                <h2>New task</h2>
                <label
                    >What needs to be done?<input
                        id="create-title"
                        required
                        maxlength="2048" /></label
                ><label
                    >Acceptance criteria<input
                        id="create-acceptance"
                        placeholder="What will demonstrate that this is done?"
                /></label>
                <div class="grid">
                    <label>Project<input id="create-project" /></label
                    ><label
                        >Assigned actor (optional)<input id="create-owner"
                    /></label>
                </div>
                <label>Context<textarea id="create-text"></textarea></label>
                <p>
                    <small
                        >Completed work goes to a different actor for
                        review.</small
                    >
                </p>
                <div class="actions">
                    <button class="primary" type="submit">Create task</button
                    ><button id="create-cancel" type="button">Cancel</button>
                </div>
            </form>
        </dialog>
        <script>
            "use strict";
            const $ = (id) => document.getElementById(id);
            $("theme").value = document.documentElement.dataset.theme || "system";
            $("theme").onchange = () => {
                const theme = $("theme").value;
                if (theme === "system") delete document.documentElement.dataset.theme;
                else document.documentElement.dataset.theme = theme;
                try {
                    if (theme === "system") localStorage.removeItem("org-theme");
                    else localStorage.setItem("org-theme", theme);
                } catch {}
            };
            let selected = null,
                fetched = null,
                next = null,
                rows = [],
                canWrite = false,
                busy = false,
                connected = false,
                draftDirty = false,
                selectionVersion = 0,
                createRequest = null,
                claimRequest = null;
            const message = (text) => {
                $("message").textContent = text;
            };
            const el = (tag, text, cls) => {
                const n = document.createElement(tag);
                if (text !== undefined) n.textContent = text;
                if (cls) n.className = cls;
                return n;
            };
            const actor = () => {
                const value = $("actor").value.trim();
                if (!value)
                    throw Error("Enter your actor name before making changes.");
                return value;
            };
            async function request(operation, args) {
                const headers = { "Content-Type": "application/json" };
                if ($("token").value)
                    headers.Authorization = "Bearer " + $("token").value;
                const response = await fetch("/api/v1/" + operation, {
                    method: args === undefined ? "GET" : "POST",
                    headers,
                    body: args === undefined ? undefined : JSON.stringify(args),
                });
                if (response.status === 401)
                    throw Error(
                        "Enter the access token configured for this server, then connect.",
                    );
                const payload = await response.json();
                if (!response.ok || payload.ok === false)
                    throw Error(
                        payload.error?.message ||
                            "Request failed (" +
                                response.status +
                                "). Refresh to inspect the current task before retrying.",
                    );
                return payload.data ?? payload;
            }
            async function run(fn, background = false) {
                if (busy) return;
                busy = true;
                document.body.setAttribute("aria-busy", "true");
                if (!background) message("");
                try {
                    await fn();
                } catch (error) {
                    message(error.message);
                } finally {
                    busy = false;
                    document.body.setAttribute("aria-busy", "false");
                    document
                        .querySelectorAll("button[data-write]")
                        .forEach((b) => (b.disabled = !canWrite));
                }
            }
            let calendarDate = new Date();
            const expandedGroups = new Set();
            function rememberExpansion(element, key, defaultOpen = false) {
                element.open = defaultOpen || expandedGroups.has(key);
                element.ontoggle = () => {
                    if (!element.isConnected) return;
                    if (element.open) expandedGroups.add(key);
                    else expandedGroups.delete(key);
                };
            }
            const dayKey = (date) => [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
            const todayKey = () => dayKey(new Date());
            const finished = (row) => ["done", "cancelled"].includes(row.status);
            function dateLabel(stamp) {
                if (!stamp) return "";
                return stamp.date + (stamp.time ? " " + stamp.time : "") +
                    (stamp.end ? " – " + dateLabel(stamp.end) : "") +
                    (stamp.repeater ? " (" + stamp.repeater + ")" : "");
            }
            async function load(more = false) {
                const comprehensive = $("view").value !== "list" || $("search-filter").value.trim();
                let offset = more ? (next ?? 0) : 0;
                let collected = more ? [...rows] : [];
                let response;
                do {
                    response = await request("tasks", {
                        status: $("status").value,
                        project: $("project-filter").value,
                        owner: $("owner-filter").value,
                        limit: 100,
                        offset,
                    });
                    collected.push(...response.tasks);
                    offset = response.next_offset;
                } while (comprehensive && offset !== null);
                rows = collected;
                next = offset;
                $("more").hidden = next === null;
                $("count").textContent = "· " + response.total;
                $("coverage").textContent = next === null ? "All matching tasks loaded." : rows.length + " of " + response.total + " tasks loaded. Load more to see the rest.";
                renderList();
            }
            function taskCard(row, compact = false, eventLabel = "") {
                const b = el("button", undefined, "task");
                b.setAttribute("aria-pressed", String(selected?.ref === row.ref));
                b.append(el("span", row.status, "badge " + row.status));
                if (eventLabel) b.append(el("span", eventLabel, "meta"));
                b.append(el("span", row.title, "task-title"));
                const add = (text, cls = "meta") => { if (text) b.append(el("span", text, cls)); };
                add("Owner: " + (row.owner || "Unassigned"));
                if (row.claimed_by) add("Claimed by: " + row.claimed_by + (compact ? "" : " · until " + row.claim_until));
                add("File: " + row.file);
                if (row.priority) add("Priority " + row.priority);
                if (!compact) {
                    if (row.outline?.length) add(row.outline.join(" / "));
                    if (row.project) add("Project: " + row.project);
                    if (row.state && row.state.toLowerCase() !== row.status) add("Org state: " + row.state);
                    if (row.scheduled) add("Scheduled: " + dateLabel(row.scheduled));
                    if (row.deadline) add("Deadline: " + dateLabel(row.deadline));
                    if (row.tags?.length) add("Tags: " + row.tags.join(", "));
                    if (row.acceptance) add("Acceptance: " + row.acceptance, "meta preview");
                    if (row.depends_on?.length) add("Dependencies: " + row.depends_on.length);
                    for (const blocker of row.blockers) add(blocker, "meta overdue");
                    if (row.review_required && !finished(row)) add(row.status === "review" ? "Awaiting review" + (row.submitted_by ? " · submitted by " + row.submitted_by : "") : "Review required");
                } else if (row.blockers.length) add(row.blockers.length + " blocker(s)", "meta overdue");
                if (!finished(row) && row.deadline?.date < todayKey()) add("Overdue deadline", "meta overdue");
                if (!finished(row) && row.scheduled?.date < todayKey()) add("Scheduled earlier", "meta overdue");
                if (row.claim_stale || row.submission_stale) add("Requirements changed", "meta overdue");
                if (row.claim_expired) add("Claim expired", "meta overdue");
                b.onclick = () => run(() => choose(row));
                return b;
            }
            function planningEvents(tasks) {
                return tasks.flatMap(row => ["scheduled", "deadline"].filter(kind => row[kind]).map(kind => ({row, kind, stamp: row[kind]})))
                    .sort((a,b) => (a.stamp.date + (a.stamp.time || "")).localeCompare(b.stamp.date + (b.stamp.time || "")) || a.row.title.localeCompare(b.row.title));
            }
            function renderList() {
                const list = $("list"), view = $("view").value;
                document.querySelector(".layout").classList.toggle("wide", view !== "list");
                $("calendar-scale-label").hidden = view !== "calendar";
                list.className = view === "board" ? "board" : "list";
                const calendarScroll = list.querySelector(".calendar-scroll")?.scrollLeft || 0;
                list.replaceChildren();
                const query = $("search-filter").value.trim().toLowerCase();
                const visible = rows.filter(row => [row.title, row.file, row.owner, row.project, row.acceptance, ...(row.tags || []), ...(row.outline || [])].join(" ").toLowerCase().includes(query));
                if (view === "board") {
                    for (const [status, name] of [["ready","Ready"],["working","In progress"],["review","Review"],["blocked","Blocked"],["done","Done"],["cancelled","Cancelled"]]) {
                        const group = visible.filter(row => row.status === status);
                        const column = el(["done","cancelled"].includes(status) ? "details" : "section", undefined, "column");
                        if (column.tagName === "DETAILS") rememberExpansion(column, "board-" + status);
                        column.append(el(column.tagName === "DETAILS" ? "summary" : "h3", name + " · " + group.length));
                        group.forEach(row => column.append(taskCard(row)));
                        list.append(column);
                    }
                } else if (view === "agenda") {
                    const groups = new Map();
                    for (const event of planningEvents(visible)) {
                        const day = event.stamp.date;
                        const key = day < todayKey() && !finished(event.row) ? "Overdue / scheduled earlier" : day === todayKey() ? "Today · " + day : day;
                        if (!groups.has(key)) groups.set(key, []);
                        groups.get(key).push(event);
                    }
                    for (const [label, events] of [...groups].sort(([a], [b]) => a.startsWith("Overdue") ? -1 : b.startsWith("Overdue") ? 1 : 0)) {
                        const group = el("section", undefined, "agenda-group");
                        group.append(el("h3", label));
                        events.forEach(event => group.append(taskCard(event.row, false, (event.kind === "deadline" ? "Deadline: " : "Scheduled: ") + dateLabel(event.stamp))));
                        list.append(group);
                    }
                    appendUnscheduled(list, visible);
                } else if (view === "calendar") renderCalendar(list, visible);
                else visible.forEach(row => list.append(taskCard(row)));
                const scroller = list.querySelector(".calendar-scroll");
                if (scroller) scroller.scrollLeft = calendarScroll;
                if (!visible.length && view !== "calendar" && view !== "board") list.append(el("p", "No tasks in this view.", "empty"));
            }
            function appendUnscheduled(root, tasks) {
                const undated = tasks.filter(row => !row.scheduled && !row.deadline);
                if (!undated.length) return;
                const collapsible = $("view").value === "calendar";
                const group = el(collapsible ? "details" : "section", undefined, "agenda-group");
                if (collapsible) rememberExpansion(group, "unscheduled", Boolean($("search-filter").value.trim()));
                group.append(el(collapsible ? "summary" : "h3", "Unscheduled · " + undated.length));
                undated.forEach(row => group.append(taskCard(row)));
                root.append(group);
            }
            function renderCalendar(root, tasks) {
                const week = $("calendar-scale").value === "week";
                const start = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), week ? calendarDate.getDate() : 1);
                start.setDate(start.getDate() - (start.getDay() + 6) % 7);
                const days = week ? 7 : Math.ceil(((new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1).getDay() + 6) % 7 + new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 0).getDate()) / 7) * 7;
                const nav = el("div", undefined, "calendar-nav");
                for (const [label, delta] of [["Previous",-1],["Today",0],["Next",1]]) {
                    const button = el("button", label);
                    button.onclick = () => {
                        if (!delta) calendarDate = new Date();
                        else if (week) calendarDate.setDate(calendarDate.getDate() + delta * 7);
                        else calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + delta, 1);
                        renderList();
                    };
                    nav.append(button);
                }
                nav.append(el("h3", week ? "Week of " + dayKey(start) : calendarDate.toLocaleDateString(undefined, {month:"long", year:"numeric"})));
                root.append(nav, el("p", "Scheduled and deadline entries are separate. Select an entry for full details and workflow actions. Repeating tasks show their recorded occurrence; future repeats are not expanded.", "calendar-help"));
                const scroll = el("div", undefined, "calendar-scroll"), grid = el("div", undefined, "calendar");
                const events = planningEvents(tasks);
                for (let i = 0; i < days; i++) {
                    const date = new Date(start); date.setDate(start.getDate() + i);
                    const key = dayKey(date), cell = el("section", undefined, "calendar-day" + (key === todayKey() ? " today" : ""));
                    cell.dataset.date = key;
                    cell.append(el("h3", date.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"})));
                    for (const event of events.filter(event => event.stamp.date <= key && (event.stamp.end?.date || event.stamp.date) >= key))
                        cell.append(taskCard(event.row, true, (event.kind === "deadline" ? "Deadline: " : "Scheduled: ") + dateLabel(event.stamp)));
                    grid.append(cell);
                }
                scroll.append(grid); root.append(scroll);
                appendUnscheduled(root, tasks);
            }
            async function choose(row, preserveDraft = false) {
                const version = ++selectionVersion;
                const data = await request("fetch", { ref: row.ref });
                if (version !== selectionVersion) return;
                if (preserveDraft && draftDirty) {
                    message(
                        "This task changed outside the board. Your draft is preserved; select the task again to load its current version before submitting.",
                    );
                    return;
                }
                draftDirty = false;
                selected = row;
                fetched = data;
                renderList();
                renderDetail();
            }
            function property(name) {
                const drawer = fetched.text.match(
                    /^:PROPERTIES:\s*\r?\n([\s\S]*?)^:END:\s*$/m,
                );
                return (
                    drawer?.[1]
                        .match(new RegExp("^:" + name + ":\s*(.*)$", "m"))?.[1]
                        .trim() || ""
                );
            }
            function labelled(name, id, value, type = "input") {
                const label = el("label", name),
                    input = el(type);
                input.id = id;
                input.value = value || "";
                label.append(input);
                return label;
            }
            function renderDetail() {
                const root = $("detail");
                root.replaceChildren();
                if (!selected) return;
                const row = selected;
                root.append(
                    el("span", row.status, "badge " + row.status),
                    el("h2", row.title, "detail-title"),
                    el("div", row.file + " · " + row.ref, "meta"),
                );
                const metadata = taskCard(row);
                const summary = el("section", undefined, "box");
                // Reuse card metadata without nesting an interactive card in the details panel.
                for (const node of [...metadata.children].slice(2)) summary.append(node);
                root.append(summary);
                if (row.claim_stale || row.submission_stale) {
                    root.append(
                        el(
                            "p",
                            row.claim_stale
                                ? "Requirements changed since this claim. Release it, inspect the changes, and claim again."
                                : "Requirements changed after submission. Reject it and request fresh evidence.",
                            "box",
                        ),
                    );
                }
                const criteria = el("section", undefined, "box");
                criteria.append(
                    el("h3", "Acceptance"),
                    el(
                        "div",
                        row.acceptance || "No acceptance criteria recorded.",
                    ),
                );
                root.append(criteria);
                if (row.blockers.length) {
                    const box = el("section", undefined, "box");
                    box.append(el("h3", "Before this can proceed"));
                    for (const reason of row.blockers)
                        box.append(el("div", reason));
                    root.append(box);
                }
                const evidence = labelled(
                    "Evidence, review feedback, or handoff note",
                    "evidence",
                    "",
                    "textarea",
                );
                evidence.hidden = ["done", "cancelled"].includes(row.status);
                root.append(evidence);
                const actions = el("div", undefined, "actions");
                function button(label, action, cls = "") {
                    const b = el("button", label, cls);
                    b.dataset.write = "true";
                    b.disabled = !canWrite;
                    b.onclick = () => run(() => act(action));
                    actions.append(b);
                }
                if (row.status === "ready")
                    button("Claim task", "claim", "primary");
                if (row.status === "working") {
                    if (!row.claim_stale) {
                        button("Submit work", "submit", "primary");
                        button("Renew claim", "renew");
                    }
                    button("Release", "release");
                }
                if (row.status === "review") {
                    if (!row.submission_stale)
                        button("Approve", "approve", "primary");
                    button("Request changes", "reject");
                }
                if (row.claim_stale || row.submission_stale)
                    button("Reset stale workflow", "reopen");
                if (["done", "cancelled"].includes(row.status))
                    button("Reopen", "reopen");
                else button("Cancel task", "cancel", "danger");
                root.append(actions);
                if (row.claimed_by)
                    root.append(
                        el(
                            "small",
                            "Claimed by " +
                                row.claimed_by +
                                " until " +
                                row.claim_until,
                        ),
                    );
                const contract = el("details");
                contract.append(el("summary", "Task settings"));
                const form = el("form");
                form.append(
                    labelled(
                        "Acceptance criteria",
                        "edit-acceptance",
                        row.acceptance,
                    ),
                    labelled("Project", "edit-project", row.project),
                    labelled("Assigned actor", "edit-owner", row.owner),
                    labelled(
                        "Dependency IDs (space separated)",
                        "edit-deps",
                        row.depends_on.join(" "),
                    ),
                );
                const review = el(
                        "label",
                        "Require review by a different actor",
                    ),
                    select = el("select");
                select.id = "edit-review";
                for (const [v, t] of [
                    ["true", "Yes"],
                    ["false", "No"],
                ]) {
                    const o = el("option", t);
                    o.value = v;
                    select.append(o);
                }
                select.value = String(row.review_required);
                review.append(select);
                form.append(review);
                const save = el("button", "Save settings");
                save.dataset.write = "true";
                save.disabled = !canWrite;
                form.append(save);
                form.onsubmit = (e) => {
                    e.preventDefault();
                    run(async () => {
                        const result = await request("task_update", {
                            ref: fetched.ref,
                            expected_revision: fetched.revision,
                            actor: actor(),
                            acceptance: $("edit-acceptance").value,
                            project: $("edit-project").value,
                            owner: $("edit-owner").value,
                            depends_on: $("edit-deps")
                                .value.trim()
                                .split(/\s+/)
                                .filter(Boolean),
                            review_required: $("edit-review").value === "true",
                        });
                        await afterWrite(result);
                    });
                };
                contract.append(form);
                root.append(contract);
                const history =
                    fetched.text.match(
                        /^:LOGBOOK:\s*\n([\s\S]*?)^:END:\s*$/m,
                    )?.[1] || "";
                const body = fetched.text
                    .replace(/^[^\n]*\n/, "")
                    .replace(
                        /^:(?:PROPERTIES|LOGBOOK):[^\n]*\n[\s\S]*?^:END:[ \t]*$/gm,
                        "",
                    )
                    .replace(/^CLOSED:.*$/gm, "")
                    .trim();
                if (body) {
                    const context = el("section", undefined, "box");
                    context.append(el("h3", "Context"), el("pre", body));
                    root.append(context);
                }
                if (history) {
                    const audit = el("details");
                    audit.open = row.status === "review";
                    audit.append(
                        el("summary", "Work history"),
                        el("pre", history),
                    );
                    root.append(audit);
                }
                const source = el("details");
                source.append(
                    el("summary", "Source Org"),
                    el("pre", fetched.text),
                );
                root.append(source);
                if (!canWrite)
                    root.append(el("p", "Read-only workspace.", "meta"));
            }
            async function afterWrite(result) {
                if (result.warning) message(result.warning);
                await load();
                await choose(result);
            }
            async function act(action) {
                const who = actor(),
                    evidence = $("evidence").value;
                const args = {
                    ref: fetched.ref,
                    expected_revision: fetched.revision,
                    actor: who,
                    action,
                };
                if (action === "claim") {
                    if (
                        !claimRequest ||
                        claimRequest.ref !== args.ref ||
                        claimRequest.actor !== who
                    )
                        claimRequest = {
                            ref: args.ref,
                            actor: who,
                            id: crypto.randomUUID(),
                        };
                    args.claim_id = claimRequest.id;
                } else if (["renew", "release", "submit"].includes(action)) {
                    if (selected.claimed_by !== who)
                        throw Error(
                            "This task is claimed by " +
                                selected.claimed_by +
                                ". Use that actor or wait for the lease to expire.",
                        );
                    args.claim_id = property("TASK_CLAIM_ID");
                    if (!args.claim_id)
                        throw Error(
                            "Claim details changed. Refresh before continuing.",
                        );
                }
                if (
                    ["submit", "approve", "reject", "cancel"].includes(
                        action,
                    ) &&
                    !evidence.trim()
                )
                    throw Error("Add evidence or a reason before continuing.");
                if (
                    [
                        "submit",
                        "approve",
                        "reject",
                        "cancel",
                        "release",
                        "reopen",
                    ].includes(action)
                )
                    args.evidence = evidence;
                const result = await request("task_action", args);
                claimRequest = null;
                await afterWrite(result);
            }
            async function connect() {
                const tools = await request("tools");
                canWrite = tools.some(
                    (t) => (t.name ?? t.Name) === "task_action",
                );
                $("new").disabled = !canWrite;
                $("refresh").disabled = false;
                connected = true;
                await load();
                if (selected) {
                    const current = rows.find((r) => r.ref === selected.ref);
                    if (current) await choose(current);
                    else {
                        $("detail").replaceChildren(
                            el("p", "Select a task from this view.", "empty"),
                        );
                        selected = null;
                    }
                }
            }
            $("connect").onclick = () => run(connect);
            $("detail").addEventListener("input", () => {
                draftDirty = true;
            });
            $("detail").addEventListener("change", () => {
                draftDirty = true;
            });
            async function refreshView() {
                // Preserve all loaded pages, so polling does not collapse pagination.
                const count = Math.max(rows.length, 50);
                await load();
                while (next !== null && rows.length < count) await load(true);
                if (!selected) return;
                const current = rows.find((r) => r.ref === selected.ref);
                if (draftDirty) {
                    if (!current || current.revision !== fetched?.revision)
                        message(
                            "This task changed outside the board. Your draft is preserved; select the task again to load its current version before submitting.",
                        );
                    return; // Keep the original revision: never submit a draft against unseen edits.
                }
                if (current) {
                    if (
                        current.revision !== fetched?.revision ||
                        JSON.stringify(current) !== JSON.stringify(selected)
                    )
                        await choose(current, true);
                } else {
                    selected = null;
                    fetched = null;
                    $("detail").replaceChildren(
                        el(
                            "p",
                            "This task is no longer in this view. It may have moved, changed status, or been deleted.",
                            "empty",
                        ),
                    );
                }
            }
            $("refresh").onclick = () => run(refreshView);
            // Poll only while visible, connected and idle. Do not touch the creation dialog.
            setInterval(() => {
                if (
                    connected &&
                    !busy &&
                    !document.hidden &&
                    !$("create-dialog").open
                )
                    run(refreshView, true);
            }, 3000);
            $("status").onchange = () => run(() => load());
            $("project-filter").onchange = () => run(() => load());
            $("owner-filter").onchange = () => run(() => load());
            $("search-filter").onchange = () => run(() => load());
            $("view").onchange = () => run(async () => { if (connected) await load(); else renderList(); });
            $("calendar-scale").onchange = renderList;
            $("more").onclick = () => run(() => load(true));
            $("new").onclick = () => {
                createRequest = crypto.randomUUID();
                $("create-dialog").showModal();
                $("create-title").focus();
            };
            $("create-cancel").onclick = () => $("create-dialog").close();
            $("create-form").onsubmit = (e) => {
                e.preventDefault();
                run(async () => {
                    const result = await request("task_create", {
                        request_id: createRequest,
                        title: $("create-title").value,
                        actor: actor(),
                        acceptance: $("create-acceptance").value,
                        project: $("create-project").value,
                        owner: $("create-owner").value,
                        text: $("create-text").value,
                    });
                    $("create-dialog").close();
                    $("create-form").reset();
                    await afterWrite(result);
                });
            };
            run(connect);
        </script>
    </body>
</html>
