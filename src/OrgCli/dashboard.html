<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Org · Tasks</title>
        <script>
            // Apply the saved preference before painting; storage may be unavailable.
            try {
                const theme = localStorage.getItem("org-theme");
                if (theme === "light" || theme === "dark")
                    document.documentElement.dataset.theme = theme;
            } catch {}
        </script>
        <style>
            :root {
                color-scheme: light;
                --bg: #f6f5f1;
                --paper: #fffefa;
                --ink: #23332d;
                --muted: #647168;
                --line: #dce1d9;
                --green: #23624c;
                --accent: #eaf2eb;
                --warn: #94620e;
                --primary-ink: #ffffff;
                --primary-hover: #194b39;
                --warning-bg: #fff0cf;
                --blocked-bg: #f7e8e4;
                --danger: #983b2d;
                --working-bg: #e5eef7;
                --working-ink: #335d86;
            }
            :root[data-theme="dark"] {
                color-scheme: dark;
                --bg: #151b18;
                --paper: #1e2722;
                --ink: #e5ece6;
                --muted: #a6b5aa;
                --line: #405047;
                --green: #8ad5ad;
                --accent: #293e32;
                --warn: #f0ca80;
                --primary-ink: #14291e;
                --primary-hover: #a7e5c3;
                --warning-bg: #3d3220;
                --blocked-bg: #402923;
                --danger: #f2a18f;
                --working-bg: #25374a;
                --working-ink: #a2c7ed;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    color-scheme: dark;
                    --bg: #151b18;
                    --paper: #1e2722;
                    --ink: #e5ece6;
                    --muted: #a6b5aa;
                    --line: #405047;
                    --green: #8ad5ad;
                    --accent: #293e32;
                    --warn: #f0ca80;
                    --primary-ink: #14291e;
                    --primary-hover: #a7e5c3;
                    --warning-bg: #3d3220;
                    --blocked-bg: #402923;
                    --danger: #f2a18f;
                    --working-bg: #25374a;
                    --working-ink: #a2c7ed;
                }
            }
            [hidden] { display: none !important; }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--ink);
                font:
                    15px/1.5 system-ui,
                    sans-serif;
            }
            header {
                padding: 24px 36px;
                border-bottom: 1px solid var(--line);
                display: flex;
                gap: 20px;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            h1 {
                font-size: 24px;
                letter-spacing: -0.7px;
                margin: 0;
            }
            h1 span {
                font-weight: 400;
                color: var(--muted);
            }
            .connection {
                display: flex;
                gap: 10px;
                align-items: end;
                flex-wrap: wrap;
            }
            label {
                display: block;
                font-size: 12px;
                color: var(--muted);
                margin-bottom: 10px;
            }
            input,
            textarea,
            select,
            button {
                font: inherit;
                border: 1px solid var(--line);
                border-radius: 7px;
                padding: 9px 11px;
                background: var(--paper);
                color: var(--ink);
            }
            input,
            textarea,
            select {
                width: 100%;
                display: block;
                margin-top: 4px;
            }
            input:focus,
            textarea:focus,
            select:focus,
            button:focus-visible {
                outline: 2px solid var(--green);
                outline-offset: 2px;
            }
            textarea {
                resize: vertical;
                min-height: 80px;
            }
            button {
                cursor: pointer;
                font-weight: 600;
                transition: background 0.12s;
            }
            button:hover {
                background: var(--accent);
            }
            button:disabled {
                opacity: 0.45;
                cursor: default;
            }
            .primary {
                background: var(--green);
                color: var(--primary-ink);
                border-color: var(--green);
            }
            .primary:hover {
                background: var(--primary-hover);
            }
            .connection label {
                margin: 0;
                width: 150px;
            }
            .connection input {
                font-size: 13px;
            }
            .layout {
                display: grid;
                grid-template-columns: minmax(320px, 1fr) minmax(350px, 1fr);
                max-width: 1480px;
                margin: auto;
                min-height: calc(100vh - 112px);
            }
            aside {
                padding: 28px 28px 36px 36px;
                border-right: 1px solid var(--line);
            }
            main {
                padding: 28px 36px;
            }
            .toolbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                margin-bottom: 16px;
            }
            h2 {
                font-size: 18px;
                margin: 0;
            }
            .filters {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .list {
                display: grid;
                gap: 9px;
            }
            .task {
                display: block;
                text-align: left;
                padding: 16px;
                width: 100%;
                border-radius: 9px;
                background: var(--paper);
                font-weight: 400;
            }
            .task[aria-pressed="true"] {
                border-color: var(--green);
                box-shadow: inset 3px 0 var(--green);
            }
            .task-title {
                display: block;
                font-size: 16px;
                font-weight: 600;
                margin: 5px 0;
            }
            .meta {
                font-size: 12px;
                color: var(--muted);
            }
            .badge {
                display: inline-block;
                border-radius: 4px;
                font: 600 11px system-ui;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                padding: 3px 6px;
                background: var(--accent);
                color: var(--green);
            }
            .badge.review {
                background: var(--warning-bg);
                color: var(--warn);
            }
            .badge.blocked {
                background: var(--blocked-bg);
                color: var(--danger);
            }
            .badge.working {
                background: var(--working-bg);
                color: var(--working-ink);
            }
            .empty {
                padding: 44px 12px;
                color: var(--muted);
                text-align: center;
            }
            .detail-title {
                font-size: 27px;
                line-height: 1.2;
                letter-spacing: -0.5px;
                margin: 12px 0;
            }
            .box {
                padding: 16px;
                background: var(--paper);
                border: 1px solid var(--line);
                border-radius: 9px;
                margin: 18px 0;
            }
            .box h3 {
                margin: 0 0 8px;
                font-size: 13px;
                color: var(--muted);
            }
            pre {
                white-space: pre-wrap;
                overflow-wrap: anywhere;
                font:
                    13px/1.65 ui-monospace,
                    monospace;
                max-height: 420px;
                overflow: auto;
            }
            #activity:not(:empty) { padding: 8px 36px; }
            #message {
                padding: 0 36px;
                min-height: 0;
            }
            #message:not(:empty) {
                padding: 12px 36px;
                background: var(--warning-bg);
                color: var(--warn);
                border-bottom: 1px solid var(--line);
            }
            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin: 12px 0;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            details {
                margin: 16px 0;
            }
            summary {
                cursor: pointer;
                font-size: 13px;
                color: var(--green);
                font-weight: 600;
            }
            small {
                color: var(--muted);
            }
            dialog {
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 28px;
                max-width: 540px;
                width: calc(100% - 32px);
                background: var(--paper);
                color: var(--ink);
            }
            dialog::backdrop {
                background: #23332d66;
            }
            dialog h2 {
                margin-bottom: 18px;
            }
            .danger {
                color: var(--danger);
            }
            #more {
                width: 100%;
                margin-top: 12px;
            }
            footer {
                margin-top: 22px;
                color: var(--muted);
                font-size: 12px;
            }
            .meta { overflow-wrap: anywhere; }
            .grid > *, .filters > * { min-width: 0; }
            .box > .meta, .task .meta { display: block; overflow-wrap: anywhere; }
            .task-title { overflow-wrap: anywhere; }
            .preview { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
            .layout.wide .filters { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .view-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
            .view-controls label { margin: 0; }
            .layout.wide { max-width: none; grid-template-columns: minmax(0, 1fr) minmax(320px, 380px); }
            aside, main { min-width: 0; }
            .board { display: grid; grid-template-columns: repeat(6, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 12px; }
            .column { min-width: 0; }
            .column h3, .agenda-group h3 { font-size: 15px; margin: 0 0 12px; }
            .column .task, .agenda-group .task { margin-bottom: 9px; }
            .calendar-scroll { overflow-x: auto; }
            .calendar { display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); min-width: 910px; gap: 1px; background: var(--line); border: 1px solid var(--line); }
            .calendar-day { background: var(--bg); padding: 8px; min-height: 130px; }
            .calendar-day.today { box-shadow: inset 0 3px var(--green); }
            .calendar-day h3 { font-size: 12px; margin: 4px 0 8px; }
            .calendar-day .task { padding: 8px; margin-bottom: 8px; }
            .calendar-day .task-title { font-size: 13px; }
            .calendar-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
            .calendar-nav h3 { margin: 0; font-size: 16px; }
            .calendar-help { color: var(--muted); font-size: 12px; }
            .overdue { color: var(--danger); }
            @media (max-width: 800px) {
                .layout.wide { grid-template-columns: 1fr; }
                .layout.wide .filters { grid-template-columns: 1fr 1fr; }
                header {
                    padding: 20px;
                }
                .layout {
                    grid-template-columns: 1fr;
                }
                aside {
                    padding: 20px;
                    border-right: 0;
                    border-bottom: 1px solid var(--line);
                }
                main {
                    padding: 20px;
                }
                .connection {
                    width: 100%;
                }
                .connection label {
                    flex: 1;
                    min-width: 100px;
                }
                #message:not(:empty) {
                    padding: 10px 20px;
                }
                .detail-title {
                    font-size: 24px;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div>
                <h1>Org <span>/ Tasks</span></h1>
            </div>
            <div class="connection">
                <label>Theme<select id="theme">
                    <option value="system">System</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select></label>
                <label
                    >Your name<input
                        id="actor"
                        placeholder="Name for task history"
                        title="Used to record your changes and claims; this is not a login."
                        autocomplete="off" /></label
                ><label id="token-label" hidden
                    >Access token<input
                        id="token"
                        type="password"
                        autocomplete="off" /></label
                ><button id="connect" class="primary" hidden>Unlock workspace</button>
            </div>
        </header>
        <div id="message" role="status" aria-live="polite"></div>
        <div id="activity" class="meta" role="status" aria-live="polite"></div>
        <div class="layout">
            <aside>
                <div class="toolbar">
                    <h2>Work queue <small id="count"></small></h2>
                    <button id="new" disabled>+ New task</button>
                </div>
                <div class="view-controls">
                    <label>Layout<select id="view">
                        <option value="list">List</option><option value="board">Board</option>
                        <option value="agenda">Agenda</option><option value="calendar">Calendar</option>
                    </select></label>
                    <label id="calendar-scale-label" hidden>Calendar range<select id="calendar-scale">
                        <option value="month">Month</option><option value="week">Week</option>
                    </select></label>
                </div>
                <div class="filters">
                    <label
                        >Coordination<select id="status">
                            <option value="open">All open work</option>
                            <option value="ready">Ready to start</option>
                            <option value="working">In progress</option>
                            <option value="review">Needs review</option>
                            <option value="blocked">Blocked</option>
                            <option value="done">Completed</option>
                            <option value="cancelled">Cancelled</option>
                            <option value="all">Everything</option>
                        </select></label
                    ><label
                        >Project<input
                            id="project-filter"
                            placeholder="All projects"
                    /></label>

                    <label>Owner<input id="owner-filter" placeholder="All owners" /></label>
                    <label>Search<input id="search-filter" type="search" placeholder="Title, file, tag or context" /></label>

                    <label>File<select id="file-filter"><option value="">All files</option></select></label>
                    <label>Workflow<select id="workflow-filter"><option value="">All workflows</option></select></label>
                    <label>Org state<select id="state-filter"><option value="">All states</option></select></label>
                    <label>Saved view<select id="saved-view"><option value="">Choose a saved view</option></select></label>
                </div>
                <div class="actions"><button id="save-view">Save view</button><button id="delete-view">Delete saved view</button><button id="undo" disabled>Undo last change</button></div>
                <p id="coverage" class="meta" role="status"></p>
                <div id="list" class="list">
                    <p class="empty">Loading your workspace…</p>
                </div>
                <button id="more" hidden>Load more</button>
                <footer>
                    Org files hold the work and its history. The server watches
                    external edits.
                    <button id="refresh" disabled>Refresh</button>
                </footer>
            </aside>
            <main id="detail">
                <div class="empty">
                    <h2>A clear next step.</h2>
                    <p>
                        Choose a task to see its context, acceptance criteria,
                        and ownership.
                    </p>
                </div>
            </main>
        </div>
        <dialog id="create-dialog">
            <form id="create-form">
                <h2>New task</h2>
                <label>Destination file<input id="create-file" list="workspace-files" placeholder="Relevant file, or inbox.org" /></label>
                <datalist id="workspace-files"></datalist>
                <label>Parent heading<select id="create-parent"><option value="">File root</option></select></label>
                <label>Initial state<select id="create-state"></select></label>
                <label
                    >What needs to be done?<input
                        id="create-title"
                        required
                        maxlength="2048" /></label
                ><label
                    >Acceptance criteria<input
                        id="create-acceptance"
                        placeholder="What will demonstrate that this is done?"
                /></label>
                <div class="grid">
                    <label>Project<input id="create-project" /></label
                    ><label
                        >Assigned actor (optional)<input id="create-owner"
                    /></label>
                </div>
                <label>Context<textarea id="create-text"></textarea></label>
                <p>
                    <small
                        >Completed work goes to a different actor for
                        review.</small
                    >
                </p>
                <div class="actions">
                    <button class="primary" type="submit">Create task</button
                    ><button id="create-cancel" type="button">Cancel</button>
                </div>
            </form>
        </dialog>
        <script>
            "use strict";
            const $ = (id) => document.getElementById(id);
            $("theme").value = document.documentElement.dataset.theme || "system";
            $("theme").onchange = () => {
                const theme = $("theme").value;
                if (theme === "system") delete document.documentElement.dataset.theme;
                else document.documentElement.dataset.theme = theme;
                try {
                    if (theme === "system") localStorage.removeItem("org-theme");
                    else localStorage.setItem("org-theme", theme);
                } catch {}
            };
            try { $("actor").value = localStorage.getItem("org-actor") || ""; } catch {}
            function rememberName() {
                try {
                    const name = $("actor").value.trim();
                    if (name) localStorage.setItem("org-actor", name);
                    else localStorage.removeItem("org-actor");
                } catch {}
            }
            $("actor").onchange = rememberName;
            let workspace = null, savedViews = {}, draggedTask = null, draggedColumn = null;
            const preferenceFields = ["view", "status", "project-filter", "owner-filter", "search-filter", "file-filter", "workflow-filter", "state-filter", "calendar-scale"];
            const workflowKey = row => (row.states || []).join(" → ") + " | " + (row.done_states || []).join(" ");
            const preferencesKey = () => "org-view-" + workspace.workspace;
            function currentPreferences() {
                return Object.fromEntries(preferenceFields.map(id => [id, $(id).value]).concat([["calendarDate", dayKey(calendarDate)], ["expanded", [...expandedGroups]]]));
            }
            function savePreferences() {
                if (!workspace) return;
                try { localStorage.setItem(preferencesKey(), JSON.stringify({current: currentPreferences(), saved: savedViews})); } catch {}
            }
            function applyPreferences(prefs) {
                for (const id of preferenceFields) if (prefs[id] !== undefined) $(id).value = prefs[id];
                for (const id of ["view", "status", "calendar-scale"]) if (!$(id).value) $(id).selectedIndex = 0;
                if (/^\d{4}-\d{2}-\d{2}$/.test(prefs.calendarDate || "")) calendarDate = new Date(prefs.calendarDate + "T12:00:00");
                expandedGroups.clear();
                for (const key of prefs.expanded || []) expandedGroups.add(key);
            }
            function refreshSavedViews() {
                $("saved-view").replaceChildren(new Option("Choose a saved view", ""));
                for (const name of Object.keys(savedViews)) $("saved-view").append(new Option(name, name));
            }
            async function loadWorkspace(restore = false) {
                workspace = await request("workspace", {});
                const selectedFile = $("file-filter").value, selectedWorkflow = $("workflow-filter").value, selectedState = $("state-filter").value;
                $("file-filter").replaceChildren(new Option("All files", ""));
                $("workspace-files").replaceChildren();
                $("workflow-filter").replaceChildren(new Option("All workflows", ""));
                $("state-filter").replaceChildren(new Option("All states", ""));
                const workflows = new Set(), states = new Set();
                for (const file of workspace.files) {
                    $("file-filter").append(new Option(file.file, file.file));
                    $("workspace-files").append(new Option(file.file, file.file));
                    workflows.add(workflowKey(file));
                    file.states.forEach(state => states.add(state));
                }
                workflows.forEach(key => $("workflow-filter").append(new Option(key, key)));
                states.forEach(state => $("state-filter").append(new Option(state, state)));
                $("file-filter").value = selectedFile; $("workflow-filter").value = selectedWorkflow; $("state-filter").value = selectedState;
                if (restore) {
                    try { const prefs = JSON.parse(localStorage.getItem(preferencesKey()) || "{}"); savedViews = prefs.saved || {}; if (prefs.current) applyPreferences(prefs.current); } catch {}
                    refreshSavedViews();
                }
                $("undo").disabled = !canWrite || !workspace.undo?.token;
            }
            function creationFile() {
                const owner = $("create-owner").value.trim();
                return $("create-file").value.trim() || (owner && workspace?.files.some(file => file.file.startsWith(owner + "/")) ? owner + "/inbox.org" : "inbox.org");
            }
            function destinationFields(prefix) {
                const file = workspace?.files.find(file => file.file === (prefix === "create" ? creationFile() : $(prefix + "-file").value.trim()));
                const previousParent = $(prefix + "-parent").value;
                $(prefix + "-parent").replaceChildren(new Option("File root", ""));
                for (const parent of file?.parents || []) $(prefix + "-parent").append(new Option("· ".repeat(parent.level - 1) + parent.title, parent.ref));
                if ([...$(prefix + "-parent").options].some(option => option.value === previousParent)) $(prefix + "-parent").value = previousParent;
                if ($(prefix + "-state")) {
                    const active = file ? file.states.filter(state => !file.done_states.includes(state)) : (workspace?.default_states || ["TODO"]).filter(state => !(workspace?.default_done_states || []).includes(state));
                    $(prefix + "-state").replaceChildren(...active.map(state => new Option(state, state)));
                    if (active.includes("TODO")) $(prefix + "-state").value = "TODO";
                }
            }
            let selected = null,
                fetched = null,
                next = null,
                rows = [],
                canWrite = false,
                busy = false,
                connected = false,
                draftDirty = false,
                selectionVersion = 0,
                createRequest = null,
                claimRequest = null;
            const message = (text) => {
                $("message").textContent = text;
            };
            const el = (tag, text, cls) => {
                const n = document.createElement(tag);
                if (text !== undefined) n.textContent = text;
                if (cls) n.className = cls;
                return n;
            };
            const actor = () => {
                const value = $("actor").value.trim();
                if (!value)
                    throw Error("Enter your name above so this change can be recorded in the task history.");
                rememberName();
                return value;
            };
            async function request(operation, args) {
                const headers = { "Content-Type": "application/json" };
                if ($("token").value)
                    headers.Authorization = "Bearer " + $("token").value;
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 30000);
                let response, payload;
                try {
                    response = await fetch("/api/v1/" + operation, {
                    method: args === undefined ? "GET" : "POST",
                    headers,
                    body: args === undefined ? undefined : JSON.stringify(args),
                    signal: controller.signal,
                    });
                    if (response.status !== 401) payload = await response.json();
                } catch (error) {
                    const uncertainWrite = ["task_create", "task_update", "task_action", "task_move", "task_undo", "board_settings"].includes(operation);
                    throw Error((controller.signal.aborted ? "The server took too long to respond." : "Could not load the server response.") +
                        (uncertainWrite ? " The change may have been saved. Refresh and inspect the task before retrying." : " Check that the service is running, then retry."));
                } finally {
                    clearTimeout(timeout);
                }
                if (response.status === 401) {
                    connected = false;
                    $("token-label").hidden = false;
                    $("connect").hidden = false;
                    $("connect").textContent = "Unlock workspace";
                    throw Error("This workspace requires an access token. Enter it above to unlock.");
                }
                if (!response.ok || payload.ok === false)
                    throw Error(
                        payload.error?.message ||
                            "Request failed (" +
                                response.status +
                                "). Refresh to inspect the current task before retrying.",
                    );
                return payload.data ?? payload;
            }
            const pendingReads = [];
            function read(fn) {
                if (busy) pendingReads.push(fn);
                else run(fn);
            }
            function writeControls() {
                document.querySelectorAll("button[data-write], #new, #create-form button[type=submit]")
                    .forEach(button => button.disabled = busy || !canWrite);
            }
            async function run(fn, background = false) {
                if (busy) {
                    if (!background) message("An operation is still running. Wait for it to finish before making another change.");
                    return;
                }
                busy = true;
                writeControls();
                $("activity").textContent = background ? "Refreshing…" : "Loading…";
                document.body.setAttribute("aria-busy", "true");
                if (!background) message("");
                try {
                    await fn();
                } catch (error) {
                    message(error.message);
                    if (!connected) {
                        $("connect").hidden = false;
                        if ($("token-label").hidden) $("connect").textContent = "Retry loading";
                    }
                } finally {
                    busy = false;
                    document.body.setAttribute("aria-busy", "false");
                    $("activity").textContent = "";
                    writeControls();
                    const queued = pendingReads.shift();
                    if (queued) read(queued);
                }
            }
            let calendarDate = new Date();
            const expandedGroups = new Set();
            function rememberExpansion(element, key, defaultOpen = false) {

                        "reopen",
                    ].includes(action)
                )
                    args.evidence = evidence;
                if (action === "cancel") $("activity").textContent = "Cancelling task…";
                const result = await request("task_action", args);
                claimRequest = null;
                if (action === "cancel") $("activity").textContent = "Updating task list…";
                await afterWrite(result);
                if (action === "cancel") message("Task cancelled." + (result.warning ? " " + result.warning : ""));
            }
            async function connect() {
                const tools = await request("tools");
                canWrite = tools.some(
                    (t) => (t.name ?? t.Name) === "task_action",
                );
                $("new").disabled = !canWrite;
                $("refresh").disabled = false;
                await loadWorkspace(true);
                await load();
                connected = true;
                $("token-label").hidden = true;
                $("connect").hidden = true;
                if (selected) {
                    if (draftDirty) { message("Workspace loaded. Your draft is preserved."); return; }
                    const current = rows.find((r) => r.ref === selected.ref);
                    if (current) await choose(current);
                    else {
                        $("detail").replaceChildren(
                            el("p", "Select a task from this view.", "empty"),
                        );
                        selected = null;
                    }
                }
            }
            $("connect").onclick = () => read(connect);
            $("token").onkeydown = (event) => {
                if (event.key === "Enter") read(connect);
            };
            $("detail").addEventListener("input", () => {
                draftDirty = true;
            });
            $("detail").addEventListener("change", () => {
                draftDirty = true;
            });
            async function refreshView() {
                // Preserve all loaded pages, so polling does not collapse pagination.
                const count = Math.max(rows.length, 50);
                await load();
                while (next !== null && rows.length < count) await load(true);
                if (!selected) return;
                const current = rows.find((r) => r.ref === selected.ref);
                if (draftDirty) {
                    if (!current || current.revision !== fetched?.revision)
                        message(
                            "This task changed outside the board. Your draft is preserved; select the task again to load its current version before submitting.",
                        );
                    return; // Keep the original revision: never submit a draft against unseen edits.
                }
                if (current) {
                    if (
                        current.revision !== fetched?.revision ||
                        JSON.stringify(current) !== JSON.stringify(selected)
                    )
                        await choose(current, true);
                } else {
                    selected = null;
                    fetched = null;
                    $("detail").replaceChildren(
                        el(
                            "p",
                            "This task is no longer in this view. It may have moved, changed status, or been deleted.",
                            "empty",
                        ),
                    );
                }
            }
            $("refresh").onclick = () => read(async () => { await loadWorkspace(); await refreshView(); });
            // Poll only while visible, connected and idle. Do not touch the creation dialog.
            setInterval(() => {
                if (
                    connected &&
                    !busy &&
                    !document.hidden &&
                    !$("create-dialog").open
                )
                    run(refreshView, true);
            }, 3000);
            $("status").onchange = () => read(() => load());
            $("project-filter").onchange = () => read(() => load());
            $("owner-filter").onchange = () => read(() => load());
            $("search-filter").onchange = () => read(() => load());
            $("view").onchange = () => read(async () => { if (connected) await load(); else renderList(); });
            $("calendar-scale").onchange = renderList;
            $("more").onclick = () => read(() => load(true));
            $("new").onclick = () => read(async () => {
                await loadWorkspace();
                createRequest = crypto.randomUUID();
                $("create-file").value = $("file-filter").value || selected?.file || "";
                destinationFields("create");
                $("create-dialog").showModal();
                $("create-title").focus();
            });
            $("create-file").onchange = () => destinationFields("create");
            $("create-owner").onchange = () => { if (!$("create-file").value.trim()) destinationFields("create"); };
            $("create-cancel").onclick = () => $("create-dialog").close();
            $("create-form").onsubmit = (e) => {
                e.preventDefault();
                run(async () => {
                    const result = await request("task_create", {
                        request_id: createRequest,
                        ...($("create-file").value.trim() ? {file: $("create-file").value.trim()} : {}),
                        parent: $("create-parent").value,
                        state: $("create-state").value || "TODO",
                        ...(workspace.files.find(file => file.file === creationFile()) ? {destination_revision: workspace.files.find(file => file.file === creationFile()).revision} : {}),
                        title: $("create-title").value,
                        actor: actor(),
                        acceptance: $("create-acceptance").value,
                        project: $("create-project").value,
                        owner: $("create-owner").value,
                        text: $("create-text").value,
                    });
                    $("create-dialog").close();
                    $("create-form").reset();
                    await loadWorkspace();
                    await afterWrite(result);
                    message(result.warning || "Task created.");
                });
            };
            async function changeState(row, state) {
                if (row.state === state) return;
                if (!row.states.includes(state)) throw Error("This file does not define " + state + ". Choose one of its configured states.");
                const result = await request("task_action", {ref: row.ref, expected_revision: row.revision, actor: actor(), action: "state", state});
                await afterWrite(result); message("State saved as " + state + ".");
            }
            async function reorderColumn(order, from, to) {
                const next = [...order]; next.splice(next.indexOf(from), 1); next.splice(order.indexOf(to), 0, from);
                const saved = await request("board_settings", {expected_revision: workspace.revision, settings: {...workspace.settings, column_order: next}});
                workspace.settings = saved.settings; workspace.revision = saved.revision; renderList(); message("Column order saved.");
            }
            for (const id of ["file-filter", "state-filter", "workflow-filter"]) $(id).onchange = () => read(() => load());
            $("calendar-scale").onchange = () => { savePreferences(); renderList(); };
            $("save-view").onclick = () => { const name = prompt("Name this view"); if (!name?.trim() || !workspace) return; savedViews = {...savedViews, [name.trim()]: currentPreferences()}; savePreferences(); refreshSavedViews(); message("View saved in this browser."); };
            $("saved-view").onchange = () => { const prefs = savedViews[$("saved-view").value]; if (prefs) { applyPreferences(prefs); read(() => load()); } };
            $("delete-view").onclick = () => { delete savedViews[$("saved-view").value]; savePreferences(); refreshSavedViews(); };
            $("undo").onclick = () => run(async () => {
                if (!workspace.undo?.token) return;
                await request("task_undo", {token: workspace.undo.token, actor: actor()});
                selected = null; fetched = null; draftDirty = false; $("detail").replaceChildren(el("p", "Change undone. Select a task to continue.", "empty"));
                await loadWorkspace(); await load(); message("Last change undone.");
            });
            run(connect);
        </script>
    </body>
</html>
